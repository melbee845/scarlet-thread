<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one calm column like a page of an illuminated Bible; a scarlet thread runs down the chapter list. */
:root {
  --bg: #f8efe0; --surface: #fffaf1; --surface-2: #f1e4cf; --ink: #3a2a1b; --muted: #85705a; --line: #e2d2b8;
  --accent: #b5562b; --accent-ink: #fffaf1; --thread: #b8322a; --gold: #c99a2e; --ok: #4f8a3c; --bad: #b8322a;
  --p1: #b8322a; --p2: #2f6f8f;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --ui: "Nunito", "Avenir Next", system-ui, -apple-system, sans-serif;
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-palette]) {
    --bg: #121628; --surface: #1c2138; --surface-2: #262c48; --ink: #ecebf5; --muted: #a3a7c3; --line: #333a5c;
    --accent: #e3b85c; --accent-ink: #1a1d30; --thread: #e5584e; --gold: #e3b85c; --ok: #8bc272; --bad: #ef7a6f;
    --p1: #ef7a6f; --p2: #7cc4e4; color-scheme: dark;
  }
}
:root[data-theme="dark"]:not([data-palette]) {
  --bg: #121628; --surface: #1c2138; --surface-2: #262c48; --ink: #ecebf5; --muted: #a3a7c3; --line: #333a5c;
  --accent: #e3b85c; --accent-ink: #1a1d30; --thread: #e5584e; --gold: #e3b85c; --ok: #8bc272; --bad: #ef7a6f;
  --p1: #ef7a6f; --p2: #7cc4e4; color-scheme: dark;
}
:root[data-palette="sunrise"] { --bg: #f8efe0; --surface: #fffaf1; --surface-2: #f1e4cf; --ink: #3a2a1b; --muted: #85705a; --line: #e2d2b8; --accent: #b5562b; --accent-ink: #fffaf1; --thread: #b8322a; --gold: #c99a2e; --ok: #4f8a3c; --bad: #b8322a; --p1: #b8322a; --p2: #2f6f8f; color-scheme: light; }
:root[data-palette="olive"] { --bg: #eceedd; --surface: #f8f9ef; --surface-2: #dfe3c8; --ink: #283019; --muted: #6a7353; --line: #cfd5b3; --accent: #5d7027; --accent-ink: #f8f9ef; --thread: #a8352a; --gold: #a88a2a; --ok: #4f7a2c; --bad: #a8352a; --p1: #a8352a; --p2: #3b6a7a; color-scheme: light; }
:root[data-palette="galilee"] { --bg: #e3eef3; --surface: #f6fbfd; --surface-2: #d2e3ea; --ink: #14303c; --muted: #557280; --line: #c0d6df; --accent: #1d6b88; --accent-ink: #f6fbfd; --thread: #bb3a2f; --gold: #b8892a; --ok: #3f7f4a; --bad: #bb3a2f; --p1: #bb3a2f; --p2: #1d6b88; color-scheme: light; }
:root[data-palette="royal"] { --bg: #ede6f4; --surface: #faf7fd; --surface-2: #e0d5ec; --ink: #2a1c3c; --muted: #6d5b84; --line: #d4c6e3; --accent: #643a94; --accent-ink: #faf7fd; --thread: #bb2f4a; --gold: #b28a2a; --ok: #4a7f45; --bad: #bb2f4a; --p1: #bb2f4a; --p2: #643a94; color-scheme: light; }
:root[data-palette="rose"] { --bg: #f7e8ea; --surface: #fff7f8; --surface-2: #efd6da; --ink: #3c1e25; --muted: #8a5f67; --line: #e6c8cd; --accent: #a83c56; --accent-ink: #fff7f8; --thread: #9e1f2e; --gold: #b5872c; --ok: #4f7f45; --bad: #9e1f2e; --p1: #9e1f2e; --p2: #4f6f9a; color-scheme: light; }
:root[data-palette="night"] { --bg: #121628; --surface: #1c2138; --surface-2: #262c48; --ink: #ecebf5; --muted: #a3a7c3; --line: #333a5c; --accent: #e3b85c; --accent-ink: #1a1d30; --thread: #e5584e; --gold: #e3b85c; --ok: #8bc272; --bad: #ef7a6f; --p1: #ef7a6f; --p2: #7cc4e4; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-variant-numeric: lining-nums; font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.label { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.muted { color: var(--muted); }
.num, .pts, .countdown, .knot { font-variant-numeric: lining-nums tabular-nums !important; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 17px; transition: transform .12s ease, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.block { width: 100%; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; }
.mark { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
.mark h1 { font-size: 26px; font-style: italic; letter-spacing: -.01em; }
.mark svg { width: 34px; height: 34px; flex: none; }

.greet h2 { font-size: 30px; }
.greet p { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* Scoreboard */
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.side .who { font-weight: 800; display: flex; align-items: center; gap: 6px; }
.side .pts { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.side .sub { font-size: 13px; color: var(--muted); }
.side.p1 .pts { color: var(--p1); } .side.p2 .pts { color: var(--p2); }
.vs { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 20px; }
.crown { width: 18px; height: 18px; color: var(--gold); }
.lead-note { text-align: center; font-size: 14px; color: var(--muted); }

/* Today */
.today .art { border-radius: 14px; overflow: hidden; aspect-ratio: 5 / 3; max-width: 100%; }
.art svg { display: block; width: 100%; height: 100%; }
.today h3 { font-size: 28px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 700; }
.chip.done { color: var(--ok); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.countdown { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }

/* Badges */
.badges { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.badge { flex: none; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }

// Scene illustrations: a tiny vocabulary of props composed from a spec string.

  const W = 400, H = 240, G = 190;

    night: ['#141a3a', '#34406e'], storm: ['#4d5662', '#8f99a3'], glory: ['#f7d68a', '#fff7e2'],

  function sky(kind) {
    const [a, b] = skies[kind] || skies.day; const id = 'sk' + (uid++);
    let s = `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;

    return s;

    return `<path d="M0 ${G} Q100 ${G - 8} 200 ${G} T400 ${G} V${H} H0Z" fill="${c}"/><rect y="${G + 4}" width="${W}" height="${H - G}" fill="${c}"/>`;
  }

  // Props. Each returns an SVG string anchored at (x, y) = point on the ground.
  const P = {
    hills: () => `<path d="M0 ${G} Q60 120 140 ${G - 20} T300 ${G - 30} T400 ${G - 10} V${G + 10} H0Z" fill="#000" opacity=".12"/>`,
    mtn: (x) => `<path d="M${x - 120} ${G} L${x} 40 L${x + 120} ${G}Z" fill="#8c7a66"/><path d="M${x - 26} 82 L${x} 40 L${x + 26} 82 L${x + 10} 74 L${x} 86 L${x - 12} 74Z" fill="#efe6d6"/>`,
    tree: (x, y) => `<rect x="${x - 5}" y="${y - 50}" width="10" height="50" fill="#7a5130"/><circle cx="${x}" cy="${y - 66}" r="30" fill="#4f8a3c"/><circle cx="${x - 18}" cy="${y - 52}" r="18" fill="#5e9a45"/><circle cx="${x + 18}" cy="${y - 54}" r="18" fill="#477f35"/>`,
    fruit: (x, y) => P.tree(x, y) + [[-12, -70], [10, -60], [-20, -48], [16, -78], [2, -50]].map(([a, b]) => `<circle cx="${x + a}" cy="${y + b}" r="4.5" fill="#d0402f"/>`).join(''),
    palm: (x, y) => `<path d="M${x} ${y} q-6 -40 4 -80" stroke="#8a6438" stroke-width="7" fill="none"/>${[-60, -20, 20, 60, 100].map(a => `<path d="M${x + 4} ${y - 80} q${30 * Math.cos(a * Math.PI / 180)} ${-20 + 10 * Math.sin(a * Math.PI / 180)} ${48 * Math.cos(a * Math.PI / 180)} ${10 + 18 * Math.abs(Math.sin(a * Math.PI / 180))}" stroke="#4f8a3c" stroke-width="6" fill="none" stroke-linecap="round"/>`).join('')}`,
    bush: (x, y) => `<ellipse cx="${x}" cy="${y - 10}" rx="26" ry="16" fill="#557f3a"/><ellipse cx="${x + 14}" cy="${y - 16}" rx="14" ry="12" fill="#62903f"/>`,
    burn: (x, y) => P.bush(x, y) + P.flames(x, y - 14, { s: .7 }),

      if (o.sash) s += `<path d="M${x - t(10)} ${y - t(46)} L${x + t(12)} ${y - t(14)}" stroke="#c0392b" stroke-width="${t(4)}"/>`;

      return s + `</g>`;
    },
    glow: (x, y, o) => { const id = 'gl' + (uid++), r = (o.r || 60); return `<defs><radialGradient id="${id}"><stop offset="0" stop-color="#fffbe8"/><stop offset=".45" stop-color="#ffe9a8" stop-opacity=".8"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient></defs><circle cx="${x}" cy="${y - 60}" r="${r}" fill="url(#${id})"/>`; },
    jesus: (x, y, o) => P.glow(x, y, { r: 54 }) + P.fig(x, y, { c: 'w', sash: 1, ...o }),
    angel: (x, y, o) => P.glow(x, y, { r: 46 }) + P.fig(x, y, { c: 'w', wings: 1, ...o }),
    snake: (x, y) => `<path d="M${x - 30} ${y - 4} q10 -14 20 0 t20 0 t16 -8" stroke="#5c8f2e" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="${x + 26}" cy="${y - 13}" r="5" fill="#5c8f2e"/>`,
    lamb: (x, y) => `<ellipse cx="${x}" cy="${y - 16}" rx="17" ry="11" fill="#fbf8f1" stroke="#ddd3c0"/><circle cx="${x + 16}" cy="${y - 22}" r="7" fill="#fbf8f1" stroke="#ddd3c0"/><circle cx="${x + 18}" cy="${y - 23}" r="1.3" fill="#333"/><path d="M${x - 9} ${y - 6} v6 M${x + 8} ${y - 6} v6" stroke="#6b5a48" stroke-width="3"/>`,
    sheep: (x, y) => P.lamb(x - 28, y) + P.lamb(x, y + 4) + P.lamb(x + 28, y - 2),

    lion: (x, y) => `<circle cx="${x + 18}" cy="${y - 30}" r="16" fill="#b8742e"/><rect x="${x - 22}" y="${y - 30}" width="40" height="20" rx="10" fill="#d9a04a"/><circle cx="${x + 18}" cy="${y - 30}" r="10" fill="#e3b05a"/><path d="M${x - 16} ${y - 12} v12 M${x + 10} ${y - 12} v12" stroke="#c48a3a" stroke-width="5"/><path d="M${x - 22} ${y - 24} q-12 -6 -10 -16" stroke="#c48a3a" stroke-width="3" fill="none"/>`,

      ['sky:dusk ground:field hills fig@50:k+beard glow@20,140', 'God warned Cain that sin was crouching at his door. Cain did not listen and killed his brother. Even so, God put a mark on Cain to protect him.']],
  c: ['Someone else gets praised for something you worked on too. What do you do?', ['Stew about it quietly', 'Celebrate them and keep doing my best', 'Ask God to help my heart'], 'God told Cain, "You must rule over it." Jealousy is real, but with God\'s help we don\'t have to let it rule us.'],
  q: [['What was Abel\'s job?', 'Shepherd', 'Farmer', 'Builder', 'Fisherman'],
      ['What did God say was crouching at Cain\'s door?', 'Sin', 'A lion', 'A thief', 'A storm'],
      ['What did God give Cain for protection?', 'A mark', 'A sword', 'A city', 'A cloak'],],
  o: ['Cain farms and Abel shepherds', 'Both bring offerings to God', 'God warns Cain about sin', 'God marks Cain for protection'],
  th: 'Abel\'s blood cried out from the ground for justice. Jesus\' blood speaks a better word: forgiveness and mercy for everyone who comes to him.',
  v: ['to Jesus the mediator of a new covenant, and to the sprinkled blood that speaks a better word than the blood of Abel.', 'Hebrews 12:24', 'NIV', 'better', ['louder', 'final', 'kinder']] },

{ t: 'Enoch', r: 'Genesis 5', e: 'Beginnings',
  s: [['sky:dawn ground:grass hills fig@40:w+beard+grey+staff glow@60,170', 'In a long list of names that each end with "and then he died," one name stands out: Enoch.'],
      ['sky:day ground:grass hills tree@80 fig@36:w+beard+grey+staff glow@56,170', 'Enoch walked faithfully with God for 300 years. Day after day, step after step, he stayed close.'],
      ['sky:glory ground:none cloud@50,170 glow@50,110', 'Then one day Enoch was no more, because God took him away. He never tasted death.']],
  c: ['What does "walking with God" look like in your day?', ['Talking to him through the ordinary moments', 'Reading his word a little each day', 'All of it, step by step'], 'Enoch didn\'t do one big thing. He walked with God faithfully, one day at a time, just like you two are doing with this game.'],
  q: [['How many years did Enoch walk with God after his son was born?', '300', '40', '969', '12'],
      ['What happened to Enoch at the end?', 'God took him away', 'He was swallowed by a fish', 'He became a king', 'He sailed away'],
      ['Who was Enoch\'s famous son, the oldest man in the Bible?', 'Methuselah', 'Noah', 'Lamech', 'Seth'],],
  o: ['A long list of names, each ending in death', 'Enoch becomes a father', 'Enoch walks with God for 300 years', 'God takes Enoch away'],
  th: 'Enoch was a glimpse of hope that death would not have the last word. Jesus made that hope sure: whoever walks with him has life that death cannot end.',
  v: ['Enoch walked faithfully with God; then he was no more, because God took him away.', 'Genesis 5:24', 'NIV', 'walked', ['talked', 'worked', 'prayed']] },

{ t: 'Noah', r: 'Genesis 6–9', e: 'Beginnings',
  s: [['sky:day ground:grass ark@50 fig@84:k+beard+grey', 'The world was full of violence, but Noah walked with God. God told him to build a huge ark of gopher wood.'],
      ['sky:storm ground:water rain ark@50,186', 'Noah, his family, and the animals went in, and God shut the door. Rain fell for forty days and forty nights.'],
      ['sky:day ground:grass rainbow ark@68 dove@30,90 fig@30:k+beard+grey+arms', 'When the waters went down, a dove returned with an olive leaf. God set a rainbow in the clouds as a sign of his promise.']],
  c: ['Noah built for years before a single raindrop fell. What would help you keep going?', ['Remembering what God said', 'A friend cheering me on', 'Seeing small progress'], 'Noah trusted God\'s word long before he could see it come true. Faith keeps building even when the sky is clear.'],
  q: [['How long did it rain?', '40 days and 40 nights', '7 days', '3 days and 3 nights', '100 days'],
      ['What did the dove bring back?', 'An olive leaf', 'A fish', 'A rose', 'A twig of cedar'],
      ['Who shut the door of the ark?', 'God', 'Noah', 'Shem', 'The animals'],],
  o: ['God tells Noah to build an ark', 'God shuts the door', 'The dove returns with an olive leaf', 'God sets the rainbow in the sky'],
  th: 'Just as everyone inside the ark was safe through the storm, everyone who is "in Christ" is safe through judgment. Jesus is our ark, and there is room inside.',
  v: ['I have set my rainbow in the clouds, and it will be the sign of the covenant between me and the earth.', 'Genesis 9:13', 'NIV', 'rainbow', ['star', 'ark', 'dove']] },

{ t: 'Job', r: 'Job 1–42', e: 'Beginnings',
  s: [['sky:day ground:grass tent@26 sheep@60 camel@84 fig@44:p+beard', 'Job was a good man who loved God. He had a big family, thousands of animals, and many blessings.'],
      ['sky:storm ground:sand rain fig@50:s+beard', 'Then, in one terrible season, Job lost his animals, his children, and his health. His friends said it must be his fault. It wasn\'t.'],
      ['sky:storm ground:sand glow@70,120 fig@40:s+beard+arms', 'Job cried out with honest questions. God answered from the storm, showing his wisdom and power. Job worshiped, and God restored him.']],
  c: ['When life hurts and makes no sense, what is okay to do?', ['Bring God my honest questions', 'Pretend I\'m fine', 'Stop talking to God'], 'Job brought God his raw honesty, and God met him there. Lament is a form of faith.'],
  q: [['What did Job\'s friends wrongly assume?', 'His suffering was his fault', 'He was lying', 'He was rich', 'He was a king'],
      ['How did God answer Job?', 'Out of a storm', 'In a dream', 'Through a donkey', 'With a letter'],
      ['What happened at the end of Job\'s story?', 'God restored him', 'He moved to Egypt', 'He became a prophet', 'He built a temple'],],
  o: ['Job lives faithfully and is blessed', 'Job loses almost everything', 'Job\'s friends blame him', 'God speaks from the storm'],
  th: 'Job longed for a redeemer to stand up for him. Jesus is that Redeemer. He suffered though he was innocent, and he lives forever.',
  v: ['I know that my redeemer lives, and that in the end he will stand on the earth.', 'Job 19:25', 'NIV', 'redeemer', ['father', 'servant', 'shepherd']] },

{ t: 'Abraham & Sarah', r: 'Genesis 12–21', e: 'Patriarchs',
  s: [['sky:day ground:sand camel@26 tent@70 fig@46:b+beard+grey+staff fig@56:r+veil', 'God told Abram to leave his homeland for a land he would show him. Abram and Sarai packed up and went, trusting God.'],
      ['sky:night ground:sand tent@30 fig@60:b+beard+grey+staff', 'God took Abram outside and said, "Look up at the sky and count the stars. So shall your offspring be." Abram believed God.'],
      ['sky:dawn ground:sand tent@70 fig@36:b+beard+grey fig@48:r+veil fig@44,175:w+small', 'Sarah laughed at the idea of a baby at ninety. But God kept his promise, and Isaac was born. His name means "laughter."']],
  c: ['God\'s promise feels too good to be true. What do you do with it?', ['Laugh it off like Sarah did', 'Hold on to it, even while waiting', 'Ask God for patience'], 'Sarah laughed, and God made her laugh again, this time for joy. He is faithful even when our faith wobbles.'],
  q: [['What did God tell Abram to count?', 'The stars', 'The sand on the shore', 'His sheep', 'The tribes'],
      ['What does the name Isaac mean?', 'Laughter', 'Promise', 'Gift', 'Star'],
      ['How old was Sarah when Isaac was born?', 'About 90', 'About 40', 'About 120', 'About 60'],],
  o: ['God calls Abram to leave home', 'God shows Abram the stars', 'Sarah laughs at the promise', 'Isaac is born'],
  th: 'God promised that all peoples on earth would be blessed through Abraham. That blessing came through his family line to its greatest descendant: Jesus.',
  v: ['I will bless those who bless you, and whoever curses you I will curse; and all peoples on earth will be blessed through you.', 'Genesis 12:3', 'NIV', 'blessed', ['counted', 'gathered', 'ruled']] },

{ t: 'Hagar & Ishmael', r: 'Genesis 16; 21', e: 'Patriarchs',
  s: [['sky:day ground:sand tent@30 fig@60:o+veil+skin2', 'Hagar was Sarai\'s servant from Egypt. She was treated harshly and ran away into the desert.'],
      ['sky:day ground:sand well@64 angel@36 fig@60:o+veil+skin2', 'By a spring of water, the angel of the LORD found her and spoke to her. Hagar named God "El Roi," the God who sees me.'],
      ['sky:dusk ground:sand bush@30 well@70 fig@56:o+veil+skin2 fig@38:o+small+skin2', 'Years later, alone with her son Ishmael and out of water, Hagar wept. God heard the boy crying and opened her eyes to a well.']],
  c: ['When do you most need to know God sees you?', ['When I feel overlooked', 'When I\'m far from home', 'When I don\'t know what\'s next'], 'Hagar was a foreign servant whom nobody valued, yet God found her by name. You are seen too.'],
  q: [['What name did Hagar give God?', 'The God who sees me', 'The God who provides', 'The Lord my banner', 'The Prince of Peace'],
      ['Where was Hagar from?', 'Egypt', 'Babylon', 'Moab', 'Ur'],
      ['What did God show Hagar when the water ran out?', 'A well', 'A river', 'A cloud', 'A camel'],],
  o: ['Hagar runs into the desert', 'The angel finds her by a spring', 'Hagar names God "the God who sees"', 'God shows Hagar a well'],
  th: 'God sees the outsider. Jesus did the same: he noticed people others ignored and brought living water to the thirsty.',
  v: ['She gave this name to the LORD who spoke to her: "You are the God who sees me," for she said, "I have now seen the One who sees me."', 'Genesis 16:13', 'NIV', 'sees', ['saves', 'hears', 'leads']] },

{ t: 'Lot', r: 'Genesis 13; 19', e: 'Patriarchs',
  s: [['sky:day ground:grass hills sheep@30 fig@54:b+beard+grey fig@68:g+beard', 'Abraham and his nephew Lot had too many flocks to live together. Lot chose the green plain near the city of Sodom.'],
      ['sky:dusk ground:stone city angel@40 angel@58 fig@76:g+beard', 'Sodom became very wicked. Two angels came to warn Lot: "Get out, for the LORD is about to destroy this city."'],
      ['sky:dawn ground:sand flames@80,190 fig@36:g+beard fig@24:g+veil+small fig@48:g+veil+small', 'Lot hesitated, so the angels took his hand and led him out, because the LORD was merciful. His wife looked back longingly.']],
  c: ['God is leading you away from something unhealthy. What is hardest?', ['Not looking back', 'Leaving quickly', 'Trusting what\'s ahead'], 'Even when Lot hesitated, God\'s mercy took him by the hand. Grace pulls us forward.'],
  q: [['Which city did Lot settle near?', 'Sodom', 'Jericho', 'Nineveh', 'Bethel'],
      ['Who came to warn Lot?', 'Two angels', 'Abraham', 'A prophet', 'A king'],
      ['What did Lot\'s wife do?', 'Looked back', 'Ran ahead', 'Stayed behind', 'Hid in a cave'],],
  o: ['Lot chooses the green plain', 'Sodom grows wicked', 'Angels warn Lot', 'The angels lead Lot out by the hand'],
  th: 'Jesus told his followers, "Remember Lot\'s wife!" He calls us not to cling to the old life, and like the angels, he takes our hand and leads us out.',
  v: ['When he hesitated, the men grasped his hand and the hands of his wife and of his two daughters and led them safely out of the city, for the LORD was merciful to them.', 'Genesis 19:16', 'NIV', 'merciful', ['patient', 'angry', 'faithful']] },

{ t: 'Isaac & Rebekah', r: 'Genesis 22; 24', e: 'Patriarchs',
  s: [['sky:dawn ground:sand mtn@50 fig@40:b+beard+grey+staff fig@54:w+small', 'God tested Abraham: "Take your son, your only son, Isaac, whom you love." They climbed Mount Moriah together.'],
      ['sky:day ground:stone altar@40 bush@74 ram@74,180 angel@56,170', 'Isaac asked, "Where is the lamb?" Abraham said, "God himself will provide." At the last moment, God stopped him and provided a ram.'],
      ['sky:dusk ground:sand well@40 camel@78 fig@56:p+veil', 'Later, Abraham\'s servant prayed for a wife for Isaac. Kind Rebekah offered water to him and all his camels, just as he had prayed.']],
  c: ['What does it look like for you to trust God to provide?', ['Giving even when it costs me', 'Waiting instead of panicking', 'Praying specifically like the servant'], 'On that mountain Abraham named the place "The LORD Will Provide." He still does.'],
  q: [['What did God provide in Isaac\'s place?', 'A ram', 'A lamb', 'A dove', 'A goat'],
      ['On which mountain did this happen?', 'Moriah', 'Sinai', 'Carmel', 'Zion'],
      ['How did Rebekah show kindness?', 'She watered the camels', 'She baked bread', 'She sang a song', 'She wove a coat'],],
  o: ['God tests Abraham', 'Isaac asks, "Where is the lamb?"', 'God provides a ram', 'Rebekah waters the camels'],
  th: 'A father, his beloved only son, wood carried up a hill. Centuries later, on that same range of hills, God did not spare his own Son. Jesus is the Lamb God provided.',
  v: ['Abraham answered, "God himself will provide the lamb for the burnt offering, my son."', 'Genesis 22:8', 'NIV', 'lamb', ['ram', 'fire', 'altar']] },

{ t: 'Jacob & Esau', r: 'Genesis 25–33', e: 'Patriarchs',
  s: [['sky:day ground:grass tent@70 fig@34:r+beard fig@52:g', 'Twin brothers, Esau and Jacob, were always rivals. Jacob tricked Esau out of his birthright and his father\'s blessing.'],
      ['sky:night ground:sand ladder@50 stone@30 fig@30,192*.9:g angel@64,90*.6', 'Running away, Jacob slept with a stone for a pillow. He dreamed of a stairway to heaven with angels on it, and God promised, "I am with you."'],
      ['sky:dawn ground:grass fig@40:r+beard fig@58:g+arms', 'Years later, after wrestling with God all night, Jacob limped toward Esau, afraid. Esau ran to him, hugged him, and wept.']],
  c: ['Is there someone you need to make things right with?', ['Yes, and I\'ll pray about it', 'Maybe, and I\'m nervous', 'I need to forgive someone'], 'Jacob dreaded the meeting, but grace was waiting on the road. Reconciliation is often closer than we fear.'],
  q: [['What did Jacob use as a pillow?', 'A stone', 'A sheepskin', 'His cloak', 'A saddle'],
      ['What did Jacob see in his dream?', 'A stairway to heaven', 'Seven cows', 'A burning bush', 'A great statue'],
      ['What did Esau do when they met again?', 'Ran and hugged him', 'Attacked him', 'Ignored him', 'Took his flocks'],],
  o: ['Jacob takes Esau\'s blessing', 'Jacob dreams of a stairway', 'Jacob wrestles with God', 'Esau embraces Jacob'],
  th: 'Jesus told Nathanael he would see "angels ascending and descending on the Son of Man." Jesus is Jacob\'s stairway: the way between heaven and earth.',
  v: ['I am with you and will watch over you wherever you go, and I will bring you back to this land. I will not leave you until I have done what I have promised you.', 'Genesis 28:15', 'NIV', 'watch', ['wait', 'walk', 'build']] },

{ t: 'Rachel & Leah', r: 'Genesis 29–30', e: 'Patriarchs',
  s: [['sky:day ground:grass well@40 sheep@74 fig@56:r+veil fig@26:g', 'Jacob met Rachel at a well and loved her. He worked seven years for her, and they seemed like only a few days.'],
      ['sky:night ground:grass tent@50 fig@40:b+veil fig@62:g', 'But Laban tricked Jacob into marrying Rachel\'s older sister, Leah, first. Leah felt unloved and overlooked.'],
      ['sky:dawn ground:grass tent@30 fig@54:b+veil+arms fig@68:w+small', 'God saw Leah. When her fourth son was born, she stopped chasing approval and said, "This time I will praise the LORD." She named him Judah.']],
  c: ['Where do you look for approval most?', ['From people I love', 'From achievements', 'I\'m learning to rest in God\'s love'], 'Leah\'s breakthrough came when she turned from earning love to praising God. Her worth was settled in him.'],
  q: [['How many years did Jacob first work for Rachel?', 'Seven', 'Three', 'Twelve', 'Forty'],
      ['Who tricked Jacob?', 'Laban', 'Esau', 'Isaac', 'Leah'],
      ['What did Leah name the son she praised God for?', 'Judah', 'Joseph', 'Reuben', 'Benjamin'],],
  o: ['Jacob meets Rachel at a well', 'Jacob works seven years', 'Laban tricks Jacob', 'Leah praises God for Judah'],
  th: 'The unloved sister became the mother of Judah, the tribe of kings, the line of David, and the family of Jesus, the Lion of the tribe of Judah.',
  v: ['She conceived again, and when she gave birth to a son she said, "This time I will praise the LORD." So she named him Judah.', 'Genesis 29:35', 'NIV', 'praise', ['thank', 'serve', 'trust']] },

{ t: 'Joseph', r: 'Genesis 37–50', e: 'Patriarchs',
  s: [['sky:day ground:grass coat@30 fig@56:r+small fig@74:k+beard', 'Jacob gave his favorite son, Joseph, a richly ornamented coat. His jealous brothers sold him as a slave to traders headed for Egypt.'],
      ['sky:dusk ground:stone pyramid@76 fig@36:w+chain', 'In Egypt, Joseph was falsely accused and thrown in prison. Even there, the LORD was with him, and he interpreted dreams.'],
      ['sky:day ground:stone palace@50 fig@50:y+crown fig@24:k+beard fig@76:k+beard', 'Pharaoh made Joseph second in command. When famine came, his brothers bowed before him. Joseph forgave them and saved their lives.']],
  c: ['Someone hurt you badly, and now you have power over them. What do you do?', ['Forgive like Joseph', 'Test their heart first', 'Ask God to help me let go'], 'Joseph tested his brothers but chose mercy. He saw God\'s hand turning harm into good.'],
  q: [['What gift made Joseph\'s brothers jealous?', 'A special coat', 'A gold ring', 'A flock of sheep', 'A new tent'],
      ['What was Joseph gifted at explaining?', 'Dreams', 'Riddles', 'Laws', 'Stars'],
      ['Why did his brothers come to Egypt?', 'Famine', 'War', 'A wedding', 'Trade'],],
  o: ['Joseph gets his special coat', 'His brothers sell him', 'Joseph interprets dreams in prison', 'Joseph forgives his brothers'],
  th: 'Rejected by his own brothers, sold for silver, then raised up to save the very people who betrayed him: Joseph\'s story is a beautiful shadow of Jesus.',
  v: ['You intended to harm me, but God intended it for good to accomplish what is now being done, the saving of many lives.', 'Genesis 50:20', 'NIV', 'good', ['glory', 'judgment', 'gold']] },

{ t: 'Moses', r: 'Exodus 2–20', e: 'Exodus & Wilderness',
  s: [['sky:day ground:sand mtn@70 burn@50 sheep@18 fig@30:k+beard+staff', 'Moses was tending sheep when he saw a bush on fire that didn\'t burn up. God called to him: "Take off your sandals. I AM WHO I AM."'],
      ['sky:night ground:stone house@30 door@70', 'Pharaoh would not let God\'s people go. On the night of the Passover, every family put lamb\'s blood on their doorposts, and death passed over them.'],
      ['sky:day ground:sand parted fig@50:k+beard+staff+arms', 'Israel walked out of slavery. God parted the Red Sea, and later gave Moses the Ten Commandments on Mount Sinai.']],
  c: ['God calls you to something that scares you. What do you say?', ['"Who am I?"', '"Send someone else!"', '"Here I am."'], 'Moses gave every excuse, and God answered each one with "I will be with you." He equips the ones he calls.'],
  q: [['What was special about the burning bush?', 'It didn\'t burn up', 'It sang', 'It was blue', 'It grew fruit'],
      ['What went on the doorposts at Passover?', 'Lamb\'s blood', 'Oil', 'Olive branches', 'Water'],
      ['Where did Moses receive the Ten Commandments?', 'Mount Sinai', 'Mount Carmel', 'Mount Ararat', 'Mount of Olives'],],
  o: ['God speaks from the burning bush', 'The first Passover night', 'The Red Sea parts', 'God gives the Ten Commandments'],
  th: 'Jesus died at Passover. He is our Passover Lamb, and his blood means judgment passes over us. Like Moses, he leads his people out of slavery into freedom.',
  v: ['The blood will be a sign for you on the houses where you are, and when I see the blood, I will pass over you.', 'Exodus 12:13', 'NIV', 'blood', ['bread', 'light', 'staff']] },

{ t: 'Aaron', r: 'Exodus 4; 28; 32', e: 'Exodus & Wilderness',
  s: [['sky:day ground:sand fig@40:k+beard+staff fig@58:b+beard', 'Moses was afraid to speak, so God gave him his brother Aaron as a helper and spokesman.'],
      ['sky:dusk ground:sand mtn@80 fire@40,186 fig@26:b+beard', 'While Moses was on the mountain, the people pressured Aaron, and he made a golden calf. It was a terrible failure.'],
      ['sky:indoor ground:floor tent@50 fig@50:b+beard+crown altar@76', 'Yet God forgave and appointed Aaron as the first high priest. He wore the names of the twelve tribes over his heart and offered sacrifices for the people.']],
  c: ['When friends pressure you to go along with something wrong, what helps?', ['Remembering who I belong to', 'A friend who stands with me', 'Walking away early'], 'Aaron caved to pressure, but God still restored him. Failure isn\'t the end with God.'],
  q: [['How was Aaron related to Moses?', 'His brother', 'His cousin', 'His son', 'His uncle'],
      ['What idol did Aaron make?', 'A golden calf', 'A bronze snake', 'A stone pillar', 'A silver lion'],
      ['What role did God give Aaron?', 'High priest', 'King', 'Judge', 'General'],],
  o: ['God gives Aaron to help Moses', 'The people pressure Aaron', 'Aaron makes the golden calf', 'Aaron becomes high priest'],
  th: 'Aaron had to offer sacrifices for his own sins first. Jesus is the perfect High Priest. He offered himself once for all, and he carries our names over his heart forever.',
  v: ['Therefore, since we have a great high priest who has ascended into heaven, Jesus the Son of God, let us hold firmly to the faith we profess.', 'Hebrews 4:14', 'NIV', 'priest', ['king', 'prophet', 'shepherd']] },

{ t: 'Miriam', r: 'Exodus 2; 15', e: 'Exodus & Wilderness',
  s: [['sky:day ground:grass river basket@44,200 plant@76 fig@76:r+veil+small', 'When baby Moses was hidden in a basket on the Nile, his big sister Miriam watched from the reeds to see what would happen.'],
      ['sky:day ground:grass river fig@40:p+veil+crown fig@62:r+veil+small', 'When Pharaoh\'s daughter found him, brave Miriam stepped forward and offered to find a nurse, and brought back Moses\' own mother!'],
      ['sky:dawn ground:sand waves fig@36:r+veil+arms fig@54:b+veil+arms fig@70:g+veil+arms', 'Years later, after crossing the Red Sea, Miriam grabbed a tambourine and led all the women in singing and dancing to the LORD.']],
  c: ['God just did something amazing for you. How do you celebrate?', ['Sing about it', 'Tell my best friend', 'Write it down so I remember'], 'Miriam led a whole nation in joyful worship. Praise is meant to be shared.'],
  q: [['Where was baby Moses hidden?', 'In a basket on the Nile', 'In a cave', 'In a well', 'In a palace'],
      ['Who did Miriam bring to nurse Moses?', 'His own mother', 'Her friend', 'A servant', 'An Egyptian woman'],
      ['What instrument did Miriam play?', 'Tambourine', 'Harp', 'Trumpet', 'Flute'],],
  o: ['Baby Moses floats in a basket', 'Miriam watches from the reeds', 'Miriam brings their mother', 'Miriam leads the song by the sea'],
  th: 'A baby saved from a ruler who wanted to kill him, rescued to rescue others. Jesus\' story echoes Moses\', and the song of Moses becomes the song of the Lamb in Revelation.',
  v: ['Miriam sang to them: "Sing to the LORD, for he is highly exalted. Both horse and driver he has hurled into the sea."', 'Exodus 15:21', 'NIV', 'Sing', ['Pray', 'Shout', 'Bow']] },

{ t: 'Joshua', r: 'Joshua 1–6', e: 'Exodus & Wilderness',
  s: [['sky:dawn ground:grass river fig@50:k+beard+staff', 'After Moses died, Joshua led Israel. God told him three times, "Be strong and courageous."'],
      ['sky:day ground:grass wall@60 trumpet@28,160 fig@20:w+beard fig@38:w+beard', 'At Jericho, God\'s battle plan was strange: march around the city once a day for six days, then seven times on the seventh day.'],
      ['sky:dusk ground:sand stone@50 stone@60 stone@40 trumpet@20,150 fig@26:k+beard+arms', 'The priests blew trumpets, the people shouted, and the walls of Jericho fell flat!']],
  c: ['God\'s plan seems strange to you. What do you do?', ['Obey and see what he does', 'Ask him to explain first', 'Get a friend to march with me'], 'Marching and shouting doesn\'t knock walls down. God does. Obedience makes room for his power.'],
  q: [['What did God repeatedly tell Joshua to be?', 'Strong and courageous', 'Quiet and patient', 'Wise and gentle', 'Fast and clever'],
      ['How many times did they march on the seventh day?', 'Seven', 'Three', 'Twelve', 'Once'],
      ['What happened to Jericho\'s walls?', 'They fell flat', 'They caught fire', 'They grew taller', 'They sank'],],
  o: ['Joshua becomes leader', 'Israel crosses the Jordan', 'They march around Jericho', 'The walls fall down'],
  th: 'Joshua\'s name in Hebrew is Yehoshua, "The LORD saves." In Greek it\'s Iēsous, the same name as Jesus! Jesus is the greater Joshua who brings us into God\'s promised rest.',
  v: ['Have I not commanded you? Be strong and courageous. Do not be frightened, and do not be dismayed, for the LORD your God is with you wherever you go.', 'Joshua 1:9', 'ESV', 'courageous', ['careful', 'patient', 'humble']] },

{ t: 'Caleb', r: 'Numbers 13–14; Joshua 14', e: 'Exodus & Wilderness',
  s: [['sky:day ground:grass hills fruit@70 fig@30:g+beard fig@46:k+beard', 'Moses sent twelve spies into Canaan. They brought back grapes so big that two men carried one cluster on a pole!'],
      ['sky:storm ground:sand giant@76 fig@30:g+beard+arms', 'Ten spies said, "There are giants! We look like grasshoppers!" But Caleb said, "We should go up, for we can certainly do it."'],
      ['sky:dawn ground:grass mtn@60 fig@40:g+beard+grey+staff', 'Forty-five years later, at age 85, Caleb said, "I\'m as strong as ever. Give me this hill country!" And God gave it to him.']],
  c: ['Your friends see giants. What do you see?', ['The size of the problem', 'The size of my God', 'Both, honestly'], 'Caleb saw the same giants but measured them against God. That\'s what made him different.'],
  q: [['How many spies did Moses send?', 'Twelve', 'Two', 'Seven', 'Forty'],
      ['What did the other spies compare themselves to?', 'Grasshoppers', 'Ants', 'Mice', 'Sheep'],
      ['How old was Caleb when he claimed his land?', '85', '40', '120', '60'],],
  o: ['Twelve spies explore Canaan', 'Ten spies spread fear', 'Caleb says "We can do it!"', 'Caleb claims the hill country at 85'],
  th: 'Caleb followed the LORD wholeheartedly. Jesus is the only one who ever did that perfectly, and he gives his Spirit so we can follow him with our whole hearts too.',
  v: ['But because my servant Caleb has a different spirit and follows me wholeheartedly, I will bring him into the land he went to, and his descendants will inherit it.', 'Numbers 14:24', 'NIV', 'wholeheartedly', ['quietly', 'carefully', 'bravely']] },

{ t: 'Rahab', r: 'Joshua 2; 6', e: 'Exodus & Wilderness',
  s: [['sky:dusk ground:stone wall@50 fig@34:r+veil fig@62:k+beard fig@74:k+beard', 'Rahab lived in Jericho\'s wall. When two Israelite spies came, she hid them on her roof under stalks of flax.'],
      ['sky:night ground:stone wall@50 window@60,140 cord@60,152 moon@80,40', 'She said, "The LORD your God is God in heaven above and on earth below." The spies promised to save her family if she tied a scarlet cord in her window.'],
      ['sky:dawn ground:sand stone@44 stone@56 fig@36:r+veil fig@50:b+veil+small fig@64:k+beard', 'When the walls fell, the one house with a scarlet cord was spared. Rahab became part of God\'s people.']],
  c: ['Rahab chose God even though she was an outsider. What does that mean for you?', ['No past is too much for God', 'Faith can start anywhere', 'Courage matters'], 'Rahab had a messy past, but her faith put her in God\'s family forever.'],
  q: [['What did Rahab hide the spies under?', 'Stalks of flax', 'Baskets', 'Blankets', 'Hay'],
      ['What color was the cord in her window?', 'Scarlet', 'Blue', 'Gold', 'White'],
      ['Whose great-great-grandmother did Rahab become?', 'King David\'s', 'Moses\'', 'Elijah\'s', 'Samuel\'s'],],
  o: ['Spies come to Jericho', 'Rahab hides them on her roof', 'She ties a scarlet cord', 'Her family is saved'],
  th: 'This is the scarlet thread this game is named after! Rahab was saved by a scarlet cord and became an ancestor of Jesus. She\'s named in his family tree in Matthew 1.',
  v: ['"Agreed," she replied. "Let it be as you say." So she sent them away, and they departed. And she tied the scarlet cord in the window.', 'Joshua 2:21', 'NIV', 'scarlet', ['golden', 'silver', 'purple']] },
];
CHAPTERS.push(
{ t: 'Deborah', r: 'Judges 4–5', e: 'Judges',
  s: [['sky:day ground:grass hills palm@40 fig@40:p+veil fig@66:k+beard fig@78:g+beard', 'Deborah was a prophet and judge who held court under a palm tree. The Israelites came to her to settle their disputes.'],
      ['sky:storm ground:grass mtn@30 rain fig@60:p+veil+arms fig@74:k+beard+staff', 'When the cruel commander Sisera oppressed Israel with 900 iron chariots, Deborah told Barak, "Go! This is the day the LORD has given Sisera into your hands."'],
      ['sky:dawn ground:grass sun@80,50 fig@36:p+veil+arms fig@54:b+veil+arms', 'God sent a storm, the river swept the chariots away, and Deborah sang a song of victory.']],
  c: ['Someone needs encouragement to do what God is asking. What do you say?', ['"Go! God is with you."', '"I\'ll come with you."', '"Let\'s pray first."'], 'Barak would only go if Deborah went too, and she did. Sometimes faith looks like walking alongside a friend.'],
  q: [['Where did Deborah hold court?', 'Under a palm tree', 'At the city gate', 'In the temple', 'By a well'],
      ['Who was the cruel enemy commander?', 'Sisera', 'Goliath', 'Haman', 'Pharaoh'],
      ['How many iron chariots did the enemy have?', '900', '300', '12', '7,000'],],
  o: ['Deborah judges under the palm', 'Sisera oppresses Israel', 'Deborah sends Barak', 'Deborah sings of victory'],
  th: 'Deborah was a judge who rescued God\'s people and spoke his word. Jesus is the final Judge and Deliverer who will make all things right.',
  v: ['So may all your enemies perish, LORD! But may all who love you be like the sun when it rises in its strength.', 'Judges 5:31', 'NIV', 'sun', ['moon', 'river', 'cedar']] },

{ t: 'Gideon', r: 'Judges 6–7', e: 'Judges',
  s: [['sky:day ground:field wheat@30 rock@70 angel@70,150 fig@40:g', 'Gideon was hiding, threshing wheat in a winepress. The angel of the LORD said, "The LORD is with you, mighty warrior." Gideon didn\'t feel mighty at all.'],
      ['sky:night ground:grass fig@50:g+arms moon@80,40', 'Gideon asked God for signs with a wool fleece, wet one night and dry the next. God patiently gave him both.'],
      ['sky:night ground:grass tent@80 lamp@24 trumpet@40,170 jar@56 fig@30:g fig@48:k', 'God shrank his army from 32,000 to just 300. With trumpets, jars, and torches, they shouted, and the enemy army fled.']],
  c: ['God calls you something you don\'t feel like yet. How do you respond?', ['Ask for reassurance like Gideon', 'Step out anyway', 'Ask a friend to remind me'], 'God called Gideon a mighty warrior before he was one. God sees who you are becoming.'],
  q: [['Where was Gideon threshing wheat?', 'In a winepress', 'On a rooftop', 'In a field', 'In a cave'],
      ['What did Gideon use to test God?', 'A wool fleece', 'A stick', 'A coin', 'A dove'],
      ['How many men were in Gideon\'s final army?', '300', '3,000', '12', '32,000'],],
  o: ['The angel calls Gideon mighty', 'Gideon tests God with a fleece', 'God shrinks the army to 300', 'Trumpets, jars and torches win the battle'],
  th: 'God wins through weakness so no one can boast. That\'s the cross: Jesus won the greatest victory in a moment that looked like defeat.',
  v: ['When the angel of the LORD appeared to Gideon, he said, "The LORD is with you, mighty warrior."', 'Judges 6:12', 'NIV', 'warrior', ['servant', 'shepherd', 'prophet']] },

{ t: 'Samson', r: 'Judges 13–16', e: 'Judges',
  s: [['sky:day ground:sand lion@70 fig@40:k', 'Samson was set apart to God from birth and never cut his hair. God gave him incredible strength; he even tore apart a lion with his bare hands.'],
      ['sky:dusk ground:stone pillars@60 fig@30:p+veil fig@60,190:k', 'But Samson made foolish choices. Delilah tricked him into revealing his secret, and the Philistines cut his hair, captured him, and blinded him.'],
      ['sky:dark ground:stone pillars@50 fig@50:k+arms+chain', 'In a temple full of enemies, Samson prayed, "Remember me." He pushed the pillars, and in his death he defeated more enemies than in his life.']],
  c: ['You keep making the same mistake. What does Samson\'s story say?', ['God still hears my prayer', 'Choices have consequences', 'Both are true'], 'Even at Samson\'s lowest, one honest prayer reached God. It\'s never too late to say, "Remember me."'],
  q: [['What did Samson defeat with his bare hands?', 'A lion', 'A bear', 'A giant', 'A wolf'],
      ['Who tricked Samson?', 'Delilah', 'Jezebel', 'Michal', 'Ruth'],
      ['What did Samson push in the final scene?', 'Two pillars', 'A wall', 'A boulder', 'A gate'],],
  o: ['Samson defeats a lion', 'Delilah learns his secret', 'Samson is captured', 'Samson pushes the pillars'],
  th: 'Samson won his greatest victory through his own death, arms stretched between two pillars. Jesus, with arms stretched on the cross, won the ultimate victory, and he had no sin of his own.',
  v: ['Then Samson prayed to the LORD, "Sovereign LORD, remember me. Please, God, strengthen me just once more…"', 'Judges 16:28', 'NIV', 'remember', ['forgive', 'rescue', 'bless']] },

{ t: 'Ruth & Naomi', r: 'Ruth 1–2', e: 'Judges',
  s: [['sky:dusk ground:sand hills fig@36:k+veil+grey fig@54:r+veil fig@70:g+veil', 'Naomi lost her husband and both sons in Moab. She decided to go home to Bethlehem, and told her daughters-in-law to stay behind.'],
      ['sky:dawn ground:sand fig@44:k+veil+grey fig@58:r+veil+arms', 'Orpah went back, but Ruth held on: "Where you go I will go, and where you stay I will stay. Your people will be my people and your God my God."'],
      ['sky:day ground:field wheat@30 wheat@70 fig@50:r+veil', 'In Bethlehem, Ruth gleaned leftover barley in the fields to feed them both. She happened to end up in the field of a man named Boaz.']],
  c: ['A friend is going through the hardest season of her life. What does loyal love look like?', ['Showing up and staying', 'Doing practical things', 'Praying with her'], 'Ruth\'s loyalty to Naomi is one of the most beautiful friendships in the Bible, a lot like a best friend who doesn\'t leave.'],
  q: [['Where was Ruth from?', 'Moab', 'Egypt', 'Babylon', 'Edom'],
      ['Which daughter-in-law went back home?', 'Orpah', 'Ruth', 'Rachel', 'Leah'],
      ['What did Ruth gather in the fields?', 'Barley', 'Grapes', 'Figs', 'Olives'],],
  o: ['Naomi loses her family', 'Orpah returns home', 'Ruth says "Where you go I will go"', 'Ruth gleans in Boaz\'s field'],
  th: 'Ruth was an outsider who chose the God of Israel. Like Rahab, she was welcomed into the family line of Jesus. In him, outsiders become family.',
  v: ['But Ruth replied, "Don\'t urge me to leave you or to turn back from you. Where you go I will go, and where you stay I will stay. Your people will be my people and your God my God."', 'Ruth 1:16', 'NIV', 'people', ['house', 'friends', 'land']] },

{ t: 'Boaz', r: 'Ruth 2–4', e: 'Judges',
  s: [['sky:day ground:field wheat@26 wheat@80 fig@40:b+beard fig@60:r+veil', 'Boaz noticed Ruth and was kind. He told his workers to leave extra barley for her and to protect her.'],
      ['sky:night ground:field wheat@20 moon@80,40 fig@44:b+beard fig@60:r+veil', 'Naomi explained that Boaz was a "guardian-redeemer": a relative who could rescue a family by buying back their land and caring for the widow.'],
      ['sky:dawn ground:stone gate@50 fig@40:b+beard fig@60:r+veil fig@54,176:w+small', 'At the town gate, Boaz redeemed everything and married Ruth. Their son Obed became the grandfather of King David.']],
  c: ['How can you be a "Boaz" to someone this week?', ['Notice who is overlooked', 'Be generous on purpose', 'Protect someone\'s dignity'], 'Boaz went above and beyond the rules out of kindness. That\'s the heart of God.'],
  q: [['What was Boaz\'s special family role?', 'Guardian-redeemer', 'High priest', 'Judge', 'Prophet'],
      ['Where did Boaz settle the matter?', 'At the town gate', 'In the temple', 'At a well', 'In the field'],
      ['Who was Ruth and Boaz\'s son?', 'Obed', 'Jesse', 'David', 'Samuel'],],
  o: ['Boaz shows kindness to Ruth', 'Naomi explains the redeemer', 'Boaz redeems at the gate', 'Obed is born'],
  th: 'A redeemer pays the price to buy back what was lost. Jesus, born in Bethlehem from Boaz\'s family, is our Redeemer. He paid the price to bring us home.',
  v: ['The women said to Naomi: "Praise be to the LORD, who this day has not left you without a guardian-redeemer. May he become famous throughout Israel!"', 'Ruth 4:14', 'NIV', 'guardian-redeemer', ['shepherd-king', 'faithful friend', 'mighty warrior']] },

{ t: 'Hannah', r: '1 Samuel 1–2', e: 'Judges',
  s: [['sky:dusk ground:stone temple@60 fig@36:t+veil', 'Hannah longed for a child, and her rival teased her year after year. At the tabernacle, she poured out her heart to God, weeping.'],
      ['sky:indoor ground:floor fig@40:t+veil fig@64:w+beard+grey', 'The priest Eli thought she was drunk! She said, "I was pouring out my soul to the LORD." Eli blessed her: "May God grant what you asked."'],
      ['sky:dawn ground:stone temple@64 fig@36:t+veil+arms fig@50:w+small', 'God gave her a son, Samuel. Hannah kept her promise and gave him to serve God, then sang a joyful prayer.']],
  c: ['What do you do with your deepest longing?', ['Pour it out to God honestly', 'Keep it to myself', 'Share it with my best friend and pray together'], 'Hannah didn\'t hide her tears from God. Her honest prayer changed history.'],
  q: [['What did Eli think was wrong with Hannah?', 'She was drunk', 'She was sick', 'She was lost', 'She was angry'],
      ['What was Hannah\'s son\'s name?', 'Samuel', 'Saul', 'Eli', 'Obed'],
      ['What did Hannah do after he was born?', 'Gave him to serve God', 'Moved to Egypt', 'Named him king', 'Hid him away'],],
  o: ['Hannah is teased by her rival', 'Hannah prays in tears', 'Eli blesses her', 'Samuel is born'],
  th: 'Hannah\'s song says God "raises the poor from the dust." Mary\'s song in Luke 1, when she carried Jesus, sounds just like Hannah\'s. Both praise the God who lifts up the humble.',
  v: ['I prayed for this child, and the LORD has granted me what I asked of him.', '1 Samuel 1:27', 'NIV', 'prayed', ['waited', 'hoped', 'cried']] },

{ t: 'Samuel', r: '1 Samuel 3; 16', e: 'Judges',
  s: [['sky:night ground:floor lamp@70 fig@40,196:w+small', 'Young Samuel slept in the temple near the lamp of God. In the night a voice called, "Samuel!" He ran to Eli. "Here I am!"'],
      ['sky:night ground:floor lamp@70 fig@36:w+small+arms glow@64,170', 'The third time, Eli realized it was God. So Samuel answered, "Speak, for your servant is listening." God gave him his first message.'],
      ['sky:day ground:grass sheep@80 fig@40:w+beard+grey fig@58:r+small', 'Samuel grew into a great prophet. Later God sent him to anoint a shepherd boy, David, as Israel\'s next king.']],
  c: ['How do you make space to listen to God?', ['Quiet time before bed', 'Reading the Bible slowly', 'Asking wise people for help'], 'Samuel needed Eli\'s help to recognize God\'s voice. Good friends help us listen.'],
  q: [['How many times did God call before Samuel answered properly?', 'Three times', 'Once', 'Seven times', 'Twice'],
      ['Who did Samuel think was calling him?', 'Eli', 'His mother', 'An angel', 'A guard'],
      ['Who did Samuel later anoint as king?', 'David', 'Solomon', 'Gideon', 'Jonathan'],],
  o: ['Samuel sleeps near the lamp', 'Samuel runs to Eli', 'Samuel says "Speak, I\'m listening"', 'Samuel anoints David'],
  th: 'Samuel was a prophet, a priest, and the one who anointed kings. Jesus is all three at once: the Prophet who is God\'s Word, the Priest who offers himself, and the Anointed King.',
  v: ['The LORD came and stood there, calling as at the other times, "Samuel! Samuel!" Then Samuel said, "Speak, for your servant is listening."', '1 Samuel 3:10', 'NIV', 'listening', ['waiting', 'praying', 'ready']] },

{ t: 'Saul', r: '1 Samuel 9–31', e: 'Kings',
  s: [['sky:day ground:grass fig@40:p+crown fig@60:w+beard+grey', 'The people wanted a king like other nations. God gave them Saul, tall and handsome, a head taller than everyone.'],
      ['sky:dusk ground:stone altar@70 fire@70,156 fig@40:p+crown', 'But Saul grew impatient and did things his own way instead of obeying God. Samuel told him, "To obey is better than sacrifice."'],
      ['sky:dark ground:stone harp@64 fig@40:p+crown fig@64:r+small', 'Saul became jealous of David and tormented. Only David\'s harp music could calm him.']],
  c: ['When is obeying hardest for you?', ['When I\'m impatient', 'When people are watching', 'When I think I know better'], 'Saul looked like a king but didn\'t listen to the King. God cares more about our hearts than our appearance.'],
  q: [['What did Saul look like?', 'Tall and handsome', 'Short and strong', 'Old and wise', 'Young and small'],
      ['What did Samuel say is better than sacrifice?', 'To obey', 'To pray', 'To sing', 'To fast'],
      ['What calmed Saul when he was troubled?', 'David\'s harp', 'Running', 'A dove', 'His crown'],],
  o: ['Israel asks for a king', 'Saul is crowned', 'Saul disobeys', 'David plays his harp for Saul'],
  th: 'Israel\'s first king showed how much they needed a better one: a King who always obeys the Father. That King is Jesus, who said, "Not my will, but yours be done."',
  v: ['But Samuel replied: "Does the LORD delight in burnt offerings and sacrifices as much as in obeying the LORD? To obey is better than sacrifice, and to heed is better than the fat of rams."', '1 Samuel 15:22', 'NIV', 'obey', ['give', 'pray', 'fast']] },

{ t: 'Jonathan', r: '1 Samuel 18–20', e: 'Kings',
  s: [['sky:day ground:grass fig@40:b+crown fig@58:r', 'King Saul\'s son Jonathan should have been next in line for the throne. Instead, he became David\'s best friend.'],
      ['sky:day ground:grass sword@64 shield@76 fig@40:r fig@26:b+crown+arms', 'Jonathan gave David his own robe, tunic, sword, bow, and belt: a picture of loyal, sacrificial friendship.'],
      ['sky:dusk ground:grass rock@70 fig@40:b+crown fig@56:r', 'When Saul tried to kill David, Jonathan warned him with arrows in a field. The friends wept and promised to be loyal forever.']],
  c: ['What makes a friendship like Jonathan and David\'s?', ['Loyalty when it costs something', 'Cheering for each other\'s calling', 'Pointing each other to God'], 'Jonathan and David are one of the Bible\'s great best friendships. Sound like anyone you know?'],
  q: [['Who was Jonathan\'s father?', 'King Saul', 'Samuel', 'Jesse', 'Abner'],
      ['What did Jonathan give David?', 'His robe and sword', 'A horse', 'A crown', 'A ring'],
      ['How did Jonathan signal David?', 'Shooting arrows', 'Lighting a fire', 'Blowing a trumpet', 'Sending a letter'],],
  o: ['Jonathan meets David', 'Jonathan gives David his robe', 'Saul tries to kill David', 'Jonathan warns David with arrows'],
  th: 'Jonathan gave up his crown for his friend. Jesus calls us friends, and he laid down far more than a crown. He laid down his life.',
  v: ['After David had finished talking with Saul, Jonathan became one in spirit with David, and he loved him as himself.', '1 Samuel 18:1', 'NIV', 'spirit', ['heart', 'mind', 'house']] },

{ t: 'David', r: '1 Samuel 16–17; Psalms', e: 'Kings',
  s: [['sky:day ground:grass hills sheep@70 harp@26 fig@40:r+small+staff', 'David was the youngest son, a shepherd boy who wrote songs to God while watching sheep. God said, "The LORD looks at the heart."'],
      ['sky:day ground:sand giant@72 fig@30:r+small sling@36,186', 'The giant Goliath mocked God\'s people. David said, "You come against me with sword and spear, but I come in the name of the LORD." One stone, and the giant fell.'],
      ['sky:dawn ground:stone palace@50 fig@50:p+crown harp@68', 'David became Israel\'s greatest king. He wasn\'t perfect, but he loved God and wrote many psalms, including "The LORD is my shepherd."']],
  c: ['What "giant" are you facing right now?', ['Fear or worry', 'A hard situation', 'Something I\'ll tell my best friend about'], 'David\'s confidence wasn\'t in his sling. It was in the name of the LORD. Same God, same name, for your giant too.'],
  q: [['What was David\'s first job?', 'Shepherd', 'Soldier', 'Farmer', 'Priest'],
      ['What did David use to defeat Goliath?', 'A sling and a stone', 'A sword', 'A spear', 'A bow'],
      ['Which famous psalm starts "The LORD is my shepherd"?', 'Psalm 23', 'Psalm 1', 'Psalm 119', 'Psalm 91'],],
  o: ['Samuel anoints the shepherd boy', 'Goliath mocks Israel', 'David defeats Goliath', 'David becomes king'],
  th: 'God promised David that one of his descendants would reign forever. Jesus, the "Son of David," born in David\'s town, is the Good Shepherd and the forever King.',
  v: ['The LORD is my shepherd; I shall not want.', 'Psalm 23:1', 'ESV', 'shepherd', ['king', 'rock', 'light']] },

{ t: 'Abigail', r: '1 Samuel 25', e: 'Kings',
  s: [['sky:day ground:grass sheep@70 house@30 fig@50:g+beard', 'Nabal was rich but harsh. When David\'s men asked for food after protecting his flocks, Nabal insulted them.'],
      ['sky:dusk ground:sand hills fig@70:r+sword fig@80:k fig@90:k', 'Furious, David set out with 400 men for revenge.'],
      ['sky:dusk ground:sand bread@44 basket@36 fig@54:t+veil fig@70:r', 'Wise Abigail, Nabal\'s wife, rushed out with bread, wine, raisins and figs. She humbly stopped David from doing something he would regret.']],
  c: ['Your friend is about to act out of anger. What do you do?', ['Gently step in like Abigail', 'Give them space to cool off', 'Pray and speak truth kindly'], 'Abigail\'s wisdom and courage kept David from sin. Peacemakers are a gift.'],
  q: [['Who was Abigail\'s harsh husband?', 'Nabal', 'Saul', 'Uriah', 'Laban'],
      ['How many men did David bring for revenge?', '400', '12', '3,000', '40'],
      ['What did Abigail bring David?', 'Food and gifts', 'A sword', 'A letter', 'A crown'],],
  o: ['Nabal insults David\'s men', 'David sets out for revenge', 'Abigail brings food', 'David thanks God for her wisdom'],
  th: 'Abigail stood in the gap and took the blame on herself to bring peace. Jesus is the ultimate peacemaker who stood between us and judgment.',
  v: ['David said to Abigail, "Praise be to the LORD, the God of Israel, who has sent you today to meet me. May you be blessed for your good judgment…"', '1 Samuel 25:32–33', 'NIV', 'judgment', ['kindness', 'courage', 'gift']] },

{ t: 'Solomon', r: '1 Kings 3–10', e: 'Kings',
  s: [['sky:night ground:floor fig@50:p+crown glow@50,150', 'God appeared to young King Solomon in a dream: "Ask for whatever you want." Solomon asked for wisdom to lead well. God was pleased.'],
      ['sky:indoor ground:floor throne@50 fig@50:p+crown fig@26:r+veil fig@76:b+veil', 'Two women argued over a baby. Solomon\'s wise test revealed the true mother, and everyone was amazed at his God-given wisdom.'],
      ['sky:day ground:stone temple@50', 'Solomon built a magnificent temple for God in Jerusalem, and God\'s glory filled it like a cloud.']],
  c: ['If God said "Ask for anything," what would you ask?', ['Wisdom', 'Something for someone I love', 'More of him'], 'Solomon asked for wisdom, and God gave him that and much more. James 1:5 says God gives wisdom generously to anyone who asks.'],
  q: [['What did Solomon ask God for?', 'Wisdom', 'Riches', 'Long life', 'Victory'],
      ['Who argued before Solomon?', 'Two mothers', 'Two kings', 'Two brothers', 'Two priests'],
      ['What did Solomon build?', 'The temple', 'The ark', 'The tower of Babel', 'Jericho\'s walls'],],
  o: ['God offers Solomon a gift', 'Solomon asks for wisdom', 'Solomon judges the two mothers', 'God\'s glory fills the temple'],
  th: 'Jesus said, "Something greater than Solomon is here." He is Wisdom itself, and he is the true temple, the place where God lives among his people.',
  v: ['Trust in the LORD with all your heart, and do not lean on your own understanding. In all your ways acknowledge him, and he will make straight your paths.', 'Proverbs 3:5–6', 'ESV', 'Trust', ['Wait', 'Rejoice', 'Hope']] },

{ t: 'Elijah', r: '1 Kings 17–19', e: 'Prophets',
  s: [['sky:day ground:stone mtn@70 altar@40 fire@40,156 fig@24:k+beard+arms', 'On Mount Carmel, Elijah challenged 450 prophets of Baal. They shouted all day: nothing. Elijah prayed once, and God sent fire from heaven!'],
      ['sky:dusk ground:sand tree2@66 fig@44:k+beard angel@76,180', 'Then Elijah ran for his life, exhausted and afraid. Under a broom bush he wanted to give up. An angel brought him bread and water and let him sleep.'],
      ['sky:storm ground:stone mtn@60 fig@30:k+beard', 'On the mountain came a wind, an earthquake, and a fire, but God wasn\'t in them. Then came a gentle whisper, and Elijah met God there.']],
  c: ['After a big high, you crash. What does Elijah\'s story teach?', ['Rest and food matter to God', 'God speaks gently', 'I\'m not alone'], 'God didn\'t scold tired Elijah. He fed him, let him sleep, and whispered to him. He is gentle with us too.'],
  q: [['On which mountain did God send fire?', 'Carmel', 'Sinai', 'Moriah', 'Hermon'],
      ['What did the angel bring Elijah?', 'Bread and water', 'A sword', 'A scroll', 'A cloak'],
      ['How did God finally speak to Elijah?', 'A gentle whisper', 'A great wind', 'An earthquake', 'A fire'],],
  o: ['Fire falls on Mount Carmel', 'Elijah runs away exhausted', 'An angel feeds him', 'God speaks in a whisper'],
  th: 'Elijah appeared with Jesus on the Mount of Transfiguration! The prophets pointed to Jesus, and when they met him, they talked about his coming death and victory.',
  v: ['After the earthquake came a fire, but the LORD was not in the fire. And after the fire came a gentle whisper.', '1 Kings 19:12', 'NIV', 'whisper', ['thunder', 'song', 'light']] },

{ t: 'Elisha', r: '2 Kings 2–6', e: 'Prophets',
  s: [['sky:dusk ground:sand chariot@60,150 fig@30:b+beard', 'Elisha followed Elijah everywhere. When chariots of fire took Elijah to heaven, Elisha picked up his cloak and carried on his work.'],
      ['sky:indoor ground:floor jar@30 jar@44 jar@58 fig@74:o+veil', 'A poor widow had only a little oil. Elisha told her to collect empty jars, and the oil kept flowing until every jar was full!'],
      ['sky:day ground:sand hills chariot@24,130*.6 chariot@82,120*.6 fig@44:b+beard+arms fig@60:w', 'When an enemy army surrounded them, Elisha\'s servant panicked. Elisha prayed, "Open his eyes." The hills were full of horses and chariots of fire!']],
  c: ['When you feel surrounded, what do you most need?', ['Eyes to see God\'s help', 'A friend who prays for me', 'Peace in the middle of it'], '"Those who are with us are more than those who are with them." Ask God to open your eyes too.'],
  q: [['What did Elisha pick up from Elijah?', 'His cloak', 'His staff', 'His sandals', 'His scroll'],
      ['What filled the widow\'s jars?', 'Oil', 'Water', 'Wine', 'Flour'],
      ['What did the servant see on the hills?', 'Chariots of fire', 'Angels singing', 'A rainbow', 'A cloud'],],
  o: ['Elijah is taken to heaven', 'Elisha picks up the cloak', 'The widow\'s oil overflows', 'The servant sees chariots of fire'],
  th: 'Elisha fed crowds with a few loaves and raised a boy to life. Jesus did the same, and more. Elisha\'s miracles were previews of the One to come.',
  v: ['And Elisha prayed, "Open his eyes, LORD, so that he may see." Then the LORD opened the servant\'s eyes, and he looked and saw the hills full of horses and chariots of fire all around Elisha.', '2 Kings 6:17', 'NIV', 'eyes', ['heart', 'hands', 'ears']] },

{ t: 'Naaman', r: '2 Kings 5', e: 'Prophets',
  s: [['sky:day ground:stone palace@70 fig@36:p+crown fig@52:w+small+veil', 'Naaman was a mighty army commander, but he had leprosy. A young servant girl from Israel said, "There\'s a prophet who could heal him!"'],
      ['sky:day ground:sand river fig@40:p+crown fig@62:b+beard', 'Elisha didn\'t even come out. He just sent a message: "Wash seven times in the Jordan." Naaman stormed off, insulted.'],
      ['sky:dawn ground:grass river fig@50,200:p+arms glow@50,190', 'His servants convinced him to try. Naaman dipped seven times, and his skin became clean like a young boy\'s!']],
  c: ['God\'s way seems too simple or humbling. What gets in the way?', ['Pride', 'Wanting something dramatic', 'Not listening to wise friends'], 'A little girl and some servants helped a great general find healing. God uses humble voices.'],
  q: [['Who first told Naaman about the prophet?', 'A servant girl', 'The king', 'His wife', 'A soldier'],
      ['Which river did Naaman wash in?', 'The Jordan', 'The Nile', 'The Euphrates', 'The Tigris'],
      ['How many times did Naaman dip in the water?', 'Seven', 'Three', 'Twelve', 'Once'],],
  o: ['A servant girl speaks up', 'Elisha sends a message', 'Naaman gets angry', 'Naaman is healed'],
  th: 'Jesus mentioned Naaman in his first sermon: God\'s grace reaches the outsider. Jesus touched people with leprosy and made them clean, and he washes us too.',
  v: ['So he went down and dipped himself in the Jordan seven times, as the man of God had told him, and his flesh was restored and became clean like that of a young boy.', '2 Kings 5:14', 'NIV', 'seven', ['three', 'twelve', 'forty']] },

{ t: 'Jonah', r: 'Jonah 1–4', e: 'Prophets',
  s: [['sky:storm ground:none waves rain boat@50,180', 'God told Jonah to go preach to Nineveh, Israel\'s enemy. Jonah ran the other way on a ship, and God sent a great storm.'],
      ['sky:sea ground:none waves bigfish@56,140 fig@40,150*.5:k', 'The sailors threw Jonah overboard, and God sent a huge fish to swallow him. Jonah prayed inside the fish for three days and three nights.'],
      ['sky:day ground:sand city plant@70 fig@40:k+beard', 'The fish spat Jonah onto land. He preached in Nineveh, the whole city turned to God, and God showed them mercy. Jonah sulked, but God\'s compassion was bigger.']],
  c: ['God loves people you find hard to love. How do you feel?', ['Honestly? Like Jonah', 'Grateful, since he loves me too', 'Ready to pray for them'], 'The book ends with God\'s question: "Should I not have concern for that great city?" God\'s heart is wider than ours.'],
  q: [['Which city did God send Jonah to?', 'Nineveh', 'Babylon', 'Jerusalem', 'Tarshish'],
      ['How long was Jonah inside the fish?', 'Three days and three nights', 'Forty days', 'One night', 'Seven days'],
      ['How did Nineveh respond?', 'They turned to God', 'They laughed', 'They attacked', 'They ran away'],],
  o: ['Jonah runs from God', 'A storm hits the ship', 'A great fish swallows Jonah', 'Nineveh turns to God'],
  th: 'Jesus said, "As Jonah was three days and three nights in the belly of a huge fish, so the Son of Man will be three days and three nights in the heart of the earth." Then he rose!',
  v: ['But I, with shouts of grateful praise, will sacrifice to you. What I have vowed I will make good. I say, "Salvation comes from the LORD."', 'Jonah 2:9', 'NIV', 'Salvation', ['Wisdom', 'Judgment', 'Rain']] },

{ t: 'Hosea', r: 'Hosea 1–3; 11', e: 'Prophets',
  s: [['sky:day ground:grass house@60 fig@36:t+beard fig@52:r+veil', 'God asked the prophet Hosea to do something hard: marry Gomer, a woman who would be unfaithful to him. His marriage became a living picture.'],
      ['sky:dusk ground:stone city fig@60:r+veil+chain', 'Gomer left Hosea and ended up sold as a slave. It was a picture of God\'s people running from him to chase other gods.'],
      ['sky:dawn ground:stone coins@40 fig@30:t+beard fig@56:r+veil', 'God told Hosea, "Go, show your love to your wife again." Hosea bought her back and brought her home. God\'s love chases his people.']],
  c: ['How does it feel to be loved even when you\'ve wandered?', ['Humbling', 'Hard to believe', 'It makes me want to come home'], 'Hosea paid to bring Gomer home. That\'s how stubborn and faithful God\'s love is.'],
  q: [['What was Hosea\'s wife\'s name?', 'Gomer', 'Jezebel', 'Ruth', 'Michal'],
      ['What did Hosea do when she was sold?', 'Bought her back', 'Forgot her', 'Moved away', 'Became a king'],
      ['What did their marriage picture?', 'God\'s faithful love', 'A peace treaty', 'A harvest', 'A war'],],
  o: ['God asks Hosea to marry Gomer', 'Gomer leaves', 'Gomer is sold as a slave', 'Hosea buys her back'],
  th: 'Jesus is the faithful Bridegroom who paid the ultimate price, not with silver but with his life, to bring his wandering bride home.',
  v: ['I led them with cords of human kindness, with ties of love. To them I was like one who lifts a little child to the cheek, and I bent down to feed them.', 'Hosea 11:4', 'NIV', 'love', ['law', 'fire', 'gold']] },
);
CHAPTERS.push(
{ t: 'Isaiah', r: 'Isaiah 6; 9; 53', e: 'Prophets',
  s: [['sky:glory ground:stone temple@50 throne@50,140*.7 angel@26,150*.7 angel@74,150*.7', 'Isaiah saw a vision of the Lord on a high throne, with seraphim calling, "Holy, holy, holy is the LORD Almighty!" The temple shook.'],
      ['sky:glory ground:stone fig@40:b+beard angel@64,180 fire@58,128', 'Isaiah cried, "Woe to me! I am a man of unclean lips." An angel touched his lips with a burning coal: "Your guilt is taken away." God asked, "Whom shall I send?" Isaiah said, "Here am I. Send me!"'],
      ['sky:dawn ground:grass scroll@50 fig@26:b+beard', 'Isaiah prophesied about a child to be born, called Wonderful Counselor and Prince of Peace, and a Suffering Servant who would be pierced for our sins.']],
  c: ['God asks, "Whom shall I send?" What\'s your honest answer today?', ['"Here am I, send me!"', '"Can I start small?"', '"Prepare my heart first."'], 'Isaiah said yes after God cleansed him. God makes us ready before he sends us.'],
  q: [['What did the seraphim call out?', '"Holy, holy, holy"', '"Glory, glory, glory"', '"Amen, amen"', '"Rise and shine"'],
      ['What touched Isaiah\'s lips?', 'A burning coal', 'Water', 'Oil', 'A feather'],
      ['Which title for the coming child is from Isaiah 9?', 'Prince of Peace', 'Son of Thunder', 'Lion of Babylon', 'Good Samaritan'],],
  o: ['Isaiah sees the Lord on his throne', 'A coal touches his lips', 'Isaiah says "Send me!"', 'He prophesies the Suffering Servant'],
  th: 'Isaiah 53 was written about 700 years before Jesus, and it describes the cross: pierced, crushed, silent like a lamb, and bearing our sins. This is the scarlet thread at its brightest.',
  v: ['But he was pierced for our transgressions; he was crushed for our iniquities; upon him was the chastisement that brought us peace, and with his wounds we are healed.', 'Isaiah 53:5', 'ESV', 'healed', ['saved', 'blessed', 'free']] },

{ t: 'Micah', r: 'Micah 5–7', e: 'Prophets',
  s: [['sky:day ground:field wheat@70 fig@40:g+beard', 'Micah was a prophet from a small country town. He spoke up for the poor when the powerful were being unfair.'],
      ['sky:night ground:grass hills house@50 star@60,40', 'He made an astonishing prediction: the ruler of Israel, whose origins are from ancient times, would come from little Bethlehem.'],
      ['sky:dawn ground:grass fig@50:g+beard+arms flowers@24', 'Micah summed up what God wants: "To act justly and to love mercy and to walk humbly with your God."']],
  c: ['Which part of Micah 6:8 is God growing in you?', ['Acting justly', 'Loving mercy', 'Walking humbly'], 'These three go together like a cord of three strands. Pick one to practice this week.'],
  q: [['Which town did Micah say the ruler would come from?', 'Bethlehem', 'Jerusalem', 'Nazareth', 'Jericho'],
      ['Who did Micah speak up for?', 'The poor', 'The kings', 'The priests', 'The soldiers'],
      ['Finish Micah 6:8: "to act justly and to love…"', 'Mercy', 'Gold', 'Power', 'Wisdom'],],
  o: ['Micah speaks up for the poor', 'He warns the powerful', 'He names Bethlehem', 'He sums up what God wants'],
  th: 'When the wise men asked where the Messiah would be born, King Herod\'s scholars quoted Micah: Bethlehem! Jesus was born exactly where Micah said.',
  v: ['But you, Bethlehem Ephrathah, though you are small among the clans of Judah, out of you will come for me one who will be ruler over Israel, whose origins are from of old, from ancient times.', 'Micah 5:2', 'NIV', 'Bethlehem', ['Nazareth', 'Jerusalem', 'Hebron']] },

{ t: 'Hezekiah', r: '2 Kings 18–20', e: 'Kings',
  s: [['sky:day ground:stone temple@50 fig@50:p+crown', 'Hezekiah was a king who trusted God like few others. He cleaned out idols and reopened the temple.'],
      ['sky:dusk ground:stone wall@50 scroll@50,150 fig@30:p+crown', 'The mighty Assyrian army surrounded Jerusalem and sent a threatening letter. Hezekiah spread the letter out before the LORD and prayed.'],
      ['sky:night ground:sand tent@30 tent@70 angel@50,170', 'That night the angel of the LORD struck the Assyrian camp, and the enemy king went home. God answered Hezekiah\'s prayer.']],
  c: ['A scary message arrives. What\'s your first move?', ['Spread it out before God like Hezekiah', 'Text my best friend to pray', 'Panic, then pray'], 'Hezekiah literally laid the letter in front of God. You can bring your actual worries to him too.'],
  q: [['What did Hezekiah spread out before the LORD?', 'A threatening letter', 'A map', 'His crown', 'A sacrifice'],
      ['Which army surrounded Jerusalem?', 'The Assyrians', 'The Romans', 'The Egyptians', 'The Philistines'],
      ['Who struck the enemy camp?', 'The angel of the LORD', 'Hezekiah\'s soldiers', 'A storm', 'Elijah'],],
  o: ['Hezekiah reopens the temple', 'Assyria surrounds Jerusalem', 'Hezekiah prays over the letter', 'The angel strikes the camp'],
  th: 'Hezekiah prayed that all kingdoms would know the LORD alone is God. One day every knee will bow and every tongue will confess that Jesus Christ is Lord.',
  v: ['Now, LORD our God, deliver us from his hand, so that all the kingdoms of the earth may know that you alone, LORD, are God.', '2 Kings 19:19', 'NIV', 'alone', ['truly', 'always', 'still']] },

{ t: 'Josiah', r: '2 Kings 22–23', e: 'Kings',
  s: [['sky:day ground:stone temple@60 fig@40:p+crown+small', 'Josiah became king when he was only eight years old! As he grew, he set his heart on following God.'],
      ['sky:indoor ground:floor scroll@50 fig@30:w+beard fig@70:p+crown', 'While repairing the temple, the priest found a forgotten scroll: the Book of the Law! When Josiah heard it read, he tore his robes in sorrow.'],
      ['sky:dawn ground:stone temple@50 fig@26:p+crown+arms fig@50:k fig@64:b+veil fig@78:g', 'Josiah read God\'s word to all the people, renewed the covenant, and led the biggest Passover celebration in centuries.']],
  c: ['What could happen if you rediscovered God\'s word with fresh eyes?', ['My heart would change', 'I\'d share it with my friend', 'I\'d want to celebrate God more'], 'One forgotten scroll changed a whole nation. God\'s word is still that powerful.'],
  q: [['How old was Josiah when he became king?', 'Eight', 'Eighteen', 'Thirty', 'Twelve'],
      ['What was found in the temple?', 'The Book of the Law', 'A golden crown', 'The ark', 'A sword'],
      ['What did Josiah do when he heard it?', 'Tore his robes', 'Laughed', 'Hid it', 'Burned it'],],
  o: ['Josiah becomes king at eight', 'The temple is repaired', 'The Book of the Law is found', 'Josiah leads a great Passover'],
  th: 'Josiah\'s reform was beautiful but couldn\'t change hearts forever. Jesus is the Word made flesh. He writes God\'s law on our hearts.',
  v: ['Neither before nor after Josiah was there a king like him who turned to the LORD as he did—with all his heart and with all his soul and with all his strength, in accordance with all the Law of Moses.', '2 Kings 23:25', 'NIV', 'turned', ['prayed', 'sang', 'built']] },

{ t: 'Jeremiah', r: 'Jeremiah 1; 18; 29; 31', e: 'Prophets',
  s: [['sky:day ground:grass tree@80 fig@40:t+small', 'God called Jeremiah when he was young: "Before I formed you in the womb I knew you." Jeremiah said, "I\'m too young!" God said, "I am with you."'],
      ['sky:indoor ground:floor jar@50 fig@30:t+beard fig@70:k+beard', 'At a potter\'s house, God showed Jeremiah how a potter reshapes clay. "Like clay in the hand of the potter, so are you in my hand."'],
      ['sky:dawn ground:stone city scroll@50 fig@30:t+beard', 'Jeremiah wept over his people, earning the name "the weeping prophet." Yet he wrote God\'s promise to the exiles: plans for hope and a future, and a new covenant.']],
  c: ['How does it feel that God knew you before you were born?', ['Comforting', 'Amazing', 'It gives me courage'], 'Jeremiah\'s calling started before his first breath, and so did yours.'],
  q: [['What did Jeremiah say when God called him?', '"I\'m too young"', '"Here I am"', '"Send my brother"', '"I\'m too old"'],
      ['What did God show Jeremiah at the potter\'s house?', 'Clay being reshaped', 'A broken wall', 'A golden cup', 'A fire'],

  th: 'Jeremiah promised a "new covenant" where God would forgive and write his law on hearts. At the Last Supper Jesus lifted the cup and said, "This cup is the new covenant in my blood."',
  v: ['"For I know the plans I have for you," declares the LORD, "plans to prosper you and not to harm you, plans to give you hope and a future."', 'Jeremiah 29:11', 'NIV', 'hope', ['gold', 'rest', 'power']] },

{ t: 'Ezekiel', r: 'Ezekiel 1; 36–37', e: 'Prophets',
  s: [['sky:storm ground:sand river cloud@50,60 glow@50,120 fig@30:n+beard', 'Ezekiel was a priest living in exile in Babylon. By the river, the heavens opened and he saw dazzling visions of God\'s glory.'],
      ['sky:dusk ground:sand bones@30 bones@60 bones@80 fig@46:n+beard+arms', 'God took him to a valley full of dry bones and asked, "Can these bones live?" Ezekiel spoke God\'s word, and the bones rattled together!'],

{ t: 'Daniel', r: 'Daniel 1; 6', e: 'Exile & Return',
  s: [['sky:day ground:stone palace@60 fig@30:b fig@44:b fig@58:b fig@72:b', 'Daniel and his friends were taken to Babylon as young men. They chose to honor God, even in what they ate, and God gave them wisdom.'],

  c: ['Daniel prayed "just as he had done before." What helps you build faithful habits?', ['A regular time each day', 'A friend who checks on me', 'Starting small'], 'Daniel\'s courage in the crisis came from habits built on ordinary days. Like this daily game!'],
  q: [['How often did Daniel pray?', 'Three times a day', 'Once a week', 'Only on the Sabbath', 'Seven times a day'],

      ['Who shut the lions\' mouths?', 'God\'s angel', 'The king', 'Daniel', 'A soldier'],],

  v: ['My God sent his angel, and he shut the mouths of the lions. They have not hurt me, because I was found innocent in his sight. Nor have I ever done any wrong before you, Your Majesty.', 'Daniel 6:22', 'NIV', 'angel', ['army', 'prophet', 'king']] },

{ t: 'Shadrach, Meshach & Abednego', r: 'Daniel 3', e: 'Exile & Return',
  s: [['sky:day ground:sand fig@50*2.2:y fig@20:b fig@32:b fig@80:b', 'King Nebuchadnezzar built a gold statue 90 feet tall and ordered everyone to bow down. Three friends refused.'],
      ['sky:dusk ground:stone throne@70 fig@70:p+crown fig@26:b fig@38:b fig@50:b', 'They told the king, "Our God is able to deliver us… But even if he does not, we will not serve your gods."'],
      ['sky:dark ground:stone flames@50,200*1.4 fig@32:b+arms fig@44:b fig@56:b angel@68', 'Thrown into a furnace heated seven times hotter, they walked around unharmed, and a fourth figure was with them in the fire!']],

  q: [['What did the king order everyone to bow to?', 'A gold statue', 'His throne', 'A fire', 'The sun'],
      ['How much hotter was the furnace made?', 'Seven times', 'Twice', 'Ten times', 'Three times'],
      ['How many figures did the king see in the fire?', 'Four', 'Three', 'Two', 'Seven'],],

{ t: 'Esther', r: 'Esther 2–7', e: 'Exile & Return',
  s: [['sky:indoor ground:floor throne@70 fig@70:p+crown+beard fig@36:p+veil+crown', 'A young Jewish woman named Esther became queen of Persia, but she kept her family background a secret.'],
      ['sky:dusk ground:stone scroll@70 fig@36:p+crown+beard fig@56:r', 'The evil official Haman plotted to destroy all the Jews. Esther\'s cousin Mordecai urged her: "Who knows but that you have come to your royal position for such a time as this?"'],
      ['sky:indoor ground:floor throne@60 fig@60:p+crown+beard fig@36:p+veil+crown', 'After three days of fasting, Esther risked her life to go before the king uninvited: "If I perish, I perish." The king held out his golden scepter, and her people were saved.']],
