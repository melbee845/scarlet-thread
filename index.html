  q: [['Who was Esther\'s cousin?', 'Mordecai', 'Haman', 'Nehemiah', 'Ezra'],
      ['Who plotted against the Jews?', 'Haman', 'Xerxes', 'Darius', 'Goliath'],
      ['What did the king hold out to welcome Esther?', 'His golden scepter', 'A crown', 'A ring', 'A sword'],],
  o: ['Esther becomes queen', 'Haman plots against the Jews', 'Esther fasts three days', 'The king holds out his scepter'],
  th: 'God\'s name never appears in the book of Esther, but his hand is everywhere. Esther risked her life to save her people; Jesus gave his life to save his.',
  v: ['…And who knows but that you have come to your royal position for such a time as this?', 'Esther 4:14', 'NIV', 'time', ['crown', 'kingdom', 'people']] },

{ t: 'Mordecai', r: 'Esther 2–10', e: 'Exile & Return',
  s: [['sky:day ground:stone gate@60 fig@40:k+beard+grey', 'Mordecai raised his orphaned cousin Esther like his own daughter. He sat at the king\'s gate and overheard a plot to kill the king, and reported it.'],
      ['sky:dusk ground:stone gallows@70 fig@30:k+beard+grey fig@50:r', 'Mordecai refused to bow to proud Haman. Furious, Haman built a tall pole to hang him on.'],
      ['sky:dawn ground:stone palace@60 fig@40:p+beard+grey fig@54:k', 'But one sleepless night, the king read about Mordecai saving his life. Haman had to lead Mordecai through the city in royal robes. In the end, Mordecai became second to the king.']],
  c: ['Mordecai\'s good deed was forgotten, until the perfect moment. How does that encourage you?', ['God doesn\'t forget', 'Timing is in God\'s hands', 'Faithfulness matters even unseen'], 'A king\'s sleepless night turned the whole story around. God works through the "coincidences."'],
  q: [['How was Mordecai related to Esther?', 'Her cousin', 'Her father', 'Her uncle', 'Her brother'],
      ['What did the king read on his sleepless night?', 'How Mordecai saved his life', 'A letter from Esther', 'Haman\'s secret plan', 'A prophecy from Daniel'],
      ['Who had to honor Mordecai in the streets?', 'Haman', 'The queen', 'The guards', 'The priests'],],
  o: ['Mordecai raises Esther', 'Mordecai foils a plot on the king', 'Haman builds a pole for Mordecai', 'Mordecai is honored'],
  th: 'The enemy\'s plan was turned upside down, and the one meant for death was raised up. That\'s the shape of the cross and the empty tomb.',
  v: ['Mordecai the Jew was second in rank to King Xerxes, preeminent among the Jews, and held in high esteem by his many fellow Jews, because he worked for the good of his people and spoke up for the welfare of all the Jews.', 'Esther 10:3', 'NIV', 'good', ['glory', 'safety', 'wealth']] },

{ t: 'Ezra', r: 'Ezra 7; Nehemiah 8', e: 'Exile & Return',
  s: [['sky:day ground:sand camel@70 scroll@40,170 fig@36:w+beard', 'After the exile, God\'s people began returning to Jerusalem. Ezra, a priest and teacher, led a group back with God\'s gracious hand on him.'],
      ['sky:indoor ground:floor scroll@50 fig@40:w+beard', 'Ezra had devoted himself to studying God\'s law, living it, and teaching it.'],

      ['How long did he read?', 'From daybreak till noon', 'All night', 'Seven days', 'Ten minutes'],],

  th: 'On the road to Emmaus, Jesus did what Ezra did, but better: he opened the Scriptures and showed how all of it was about him.',
  v: ['For Ezra had devoted himself to the study and observance of the Law of the LORD, and to teaching its decrees and laws in Israel.', 'Ezra 7:10', 'NIV', 'devoted', ['promised', 'returned', 'traveled']] },

{ t: 'Nehemiah', r: 'Nehemiah 1–8', e: 'Exile & Return',
  s: [['sky:indoor ground:floor cup@60 fig@40:t+beard fig@74:p+crown+beard', 'Nehemiah was cupbearer to the king of Persia. When he heard Jerusalem\'s walls were broken down, he wept and prayed for days.'],

      ['sky:dawn ground:stone wall@50 fig@30:k+arms fig@50:b+veil+arms fig@70:g+arms', 'The wall was finished in just 52 days! Even the enemies realized God had done it. Nehemiah said, "The joy of the LORD is your strength."']],
  c: ['When people mock what God has put on your heart, what do you do?', ['Keep building', 'Pray and stay alert', 'Find people to build with'], 'Nehemiah prayed and kept working. Both matter.'],
  q: [['What was Nehemiah\'s job for the king?', 'Cupbearer', 'Baker', 'General', 'Scribe'],

{ t: 'Malachi', r: 'Malachi 3–4', e: 'Prophets',

{ t: 'Zechariah & Elizabeth', r: 'Luke 1', e: 'Gospels',

  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg>',

  flame: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4-1-6 1-9z"/></svg>',
  scroll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',

};
const threadMark = '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--surface-2)"/><path d="M6 24c6 0 6-10 12-10s6 12 0 12-3-12 5-12 7 6 11 6" fill="none" stroke="var(--thread)" stroke-width="3" stroke-linecap="round"/></svg>';

// ---- State ------------------------------------------------------------------
const S = { me: ls.get('st-me', null), players: { melisa: null, noreen: null }, notes: [], mode: 'connecting', db: null, view: 'home', play: null, canWrite: true, themeSynced: false };
let readyResolve; const ready = new Promise(r => readyResolve = r);

// ---- Theme ------------------------------------------------------------------
function applyPalette(id) { if (id && PALETTES.some(p => p.id === id)) document.documentElement.setAttribute('data-palette', id); else document.documentElement.removeAttribute('data-palette'); }
applyPalette(ls.get('st-palette', null));

// ---- Store: shared Firebase scoreboard when available, this-device storage otherwise
// The private game code travels in the link (#code), so it never sits in the public page source.
const GAME = (() => {
  const h = decodeURIComponent(location.hash.slice(1));
  if (/^[A-Za-z0-9]{16,}$/.test(h)) { ls.set('st-game', h); return h; }
  return ls.get('st-game', null);
})();
const queues = {};
function enqueue(key, fn) { const p = (queues[key] || Promise.resolve()).then(fn, fn); queues[key] = p.catch(() => {}); return p; }
function localData() { return ls.get('st-local', { players: {}, notes: [] }); }
function writeFailed(e) {
  if (e && e.code === 'permission-denied') { S.canWrite = false; toast('The scoreboard refused to save. Check the game link.'); }
  else if (e && e.code === 'resource-exhausted') toast('The scoreboard is busy right now. Try again later.');
  else toast('Couldn\'t save just now. Check your connection.');
}
async function savePlayer(pid, patch, create) {
  S.players[pid] = merge(clone(S.players[pid] || {}), patch);
  if (S.mode === 'live') {
    const ref = S.db.collection('players').doc(pid);
    const write = () => create ? ref.set(S.players[pid]) : ref.set(patch, { merge: true });
    return enqueue(pid, () => write().catch(async (e) => {
      if (e?.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try { await write(); return; } catch (e2) { writeFailed(e2); return; } }
      writeFailed(e);
    }));
  }
  const d = localData(); d.players[pid] = S.players[pid]; ls.set('st-local', d);
}
async function addNote(text, ch) {
  const note = { from: S.me, text: text.slice(0, 500), at: Date.now(), ch: ch || null };
  if (S.mode === 'live') {
    try { await S.db.collection('notes').add(note); } catch (e) { writeFailed(e); return false; }
  } else { const d = localData(); d.notes.unshift({ id: 'l' + note.at, ...note }); d.notes = d.notes.slice(0, 60); ls.set('st-local', d); S.notes = d.notes; renderIfHome(); }
  return true;
}
function goLocal() {
  S.mode = 'local'; const d = localData(); S.players = { melisa: d.players.melisa || null, noreen: d.players.noreen || null }; S.notes = d.notes || [];
  readyResolve(); render();
}
async function connect() {
  if (!window.firebase || !FIREBASE_CONFIG.apiKey || !GAME) return goLocal();
  let fs;
  try { firebase.initializeApp(FIREBASE_CONFIG); fs = firebase.firestore(); } catch { return goLocal(); }
  const game = fs.collection('games').doc(GAME);
  S.db = game; S.mode = 'live';
  let first = true;
  game.collection('players').onSnapshot((snap) => {
    const next = { melisa: null, noreen: null };
    snap.docs.forEach(d => { if (d.id in next) next[d.id] = d.data(); });
    S.players = next;
    if (first) { first = false; readyResolve(); }
    syncTheme();
    renderIfHome();
  }, () => { if (first) { first = false; readyResolve(); } toast('Couldn\'t reach the scoreboard. Check your connection and reopen the game.'); });
  game.collection('notes').orderBy('at', 'desc').limit(40).onSnapshot((snap) => {
    S.notes = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderIfHome();
  }, () => {});
  render();
}
function syncTheme() {
  if (S.themeSynced || !S.me) return; const t = S.players[S.me]?.theme;
  S.themeSynced = true; if (t && t !== ls.get('st-palette', null)) { ls.set('st-palette', t); applyPalette(t); }
}

// ---- Scoring ----------------------------------------------------------------
const chOf = (pid) => (S.players[pid] && S.players[pid].chapters) || {};
function totalOf(pid) { const c = chOf(pid); let t = 0; for (const k in c) if (c[k] && c[k].done) t += c[k].total || 0; return t; }
function doneCount(pid) { const c = chOf(pid); return Object.values(c).filter(r => r && r.done).length; }
function streakEnding(c, n) { let s = 0; for (let k = n; k >= 1; k--) { if (c[k] && c[k].onTime) s++; else break; } return s; }
function currentStreak(pid) { const c = chOf(pid), o = openCount(); if (!o) return 0; const from = c[o] && c[o].done ? o : o - 1; return streakEnding(c, from); }
function bestStreak(pid) { const c = chOf(pid); let b = 0, s = 0; for (let k = 1; k <= N; k++) { if (c[k] && c[k].onTime) { s++; b = Math.max(b, s); } else s = 0; } return b; }
function speedBonus(ms) { const s = ms / 1000; return s < 5 ? 50 : s < 10 ? 30 : s < 20 ? 10 : 0; }

const ERA_SETS = (eras) => CHAPTERS.map((c, i) => eras.includes(c.e) ? i + 1 : 0).filter(Boolean);
const OT = ERA_SETS(['Beginnings', 'Patriarchs', 'Exodus & Wilderness', 'Judges', 'Kings', 'Prophets', 'Exile & Return']);
const BADGES = [
  { id: 'first', name: 'First Knot', icon: 'knot', test: (c) => Object.values(c).some(r => r?.done) },
  { id: 'perfect', name: 'Perfect Chapter', icon: 'star', test: (c) => Object.values(c).some(r => r?.done && r.q && [0, 1, 2].every(i => r.q[i]?.ok) && r.ch?.ok) },
  { id: 'quick', name: 'Quick Draw', icon: 'bolt', test: (c) => Object.values(c).some(r => r?.done && r.q && [0, 1, 2].every(i => r.q[i]?.ok && r.q[i].ms < 5000)) },
  { id: 'streak7', name: '7-Day Streak', icon: 'flame', test: (c, pid) => bestStreak(pid) >= 7 },
  { id: 'genesis', name: 'In the Beginning', icon: 'scroll', test: (c) => ERA_SETS(['Beginnings', 'Patriarchs']).every(n => c[n]?.done) },
  { id: 'streak30', name: '30-Day Streak', icon: 'flame', test: (c, pid) => bestStreak(pid) >= 30 },
  { id: 'ot', name: 'Old Testament', icon: 'scroll', test: (c) => OT.every(n => c[n]?.done) },
  { id: 'gospels', name: 'Good News', icon: 'dove', test: (c) => ERA_SETS(['Gospels']).every(n => c[n]?.done) },
  { id: 'church', name: 'Early Church', icon: 'quill', test: (c) => ERA_SETS(['Early Church']).every(n => c[n]?.done) },
  { id: 'notes', name: 'Encourager', icon: 'quill', test: (c, pid) => S.notes.filter(x => x.from === pid).length >= 10 },
  { id: 'all', name: 'The Whole Thread', icon: 'cross', test: (c) => CHAPTERS.every((_, i) => c[i + 1]?.done) },
];

// ---- Rendering --------------------------------------------------------------
function render() {
  if (!S.me) return renderWho();
  if (S.view === 'play' && S.play) return renderPlay();
  renderHome();
}
function renderIfHome() { if (S.me && S.view === 'home') renderHome(); }

function renderWho() {
  S.view = 'who';
  app.innerHTML = `<div class="wrap">
    <div class="top"><div class="mark">${threadMark}<h1>The Scarlet Thread</h1></div><button class="icon-btn" data-act="theme" aria-label="Choose theme colors">${ICON.palette}</button></div>
    <div class="art today" style="border-radius:var(--r);overflow:hidden;aspect-ratio:5/3">${Art.render('sky:dawn ground:grass hills tree@14 house@80 cord@84,138 fig@44:r+veil fig@58:b+veil', 'Two friends at dawn')}</div>
    <div class="greet"><h2>One story, ${N} days, two friends.</h2><p>From Genesis to Revelation, one chapter opens every morning at 7:00. Every story is a thread that leads to Jesus.</p></div>
    <p class="label">Who's playing?</p>
    <div class="who-grid">${Object.entries(PLAYERS).map(([id, p]) => `<button class="who-card" data-act="pick" data-id="${id}"><span class="av" style="background:var(--${p.cls})">${p.name[0]}</span>I'm ${p.name}</button>`).join('')}</div>
    ${S.mode === 'connecting' ? '<p class="muted small">Connecting to your shared scoreboard…</p>' : ''}
    ${S.mode === 'local' ? `<p class="banner">${GAME ? 'Can\'t reach the scoreboard right now, so scores will only save on this phone.' : 'To share a scoreboard, open the game from the link Melisa sent you.'}</p>` : ''}
  </div>`;
}

function scoreSide(pid, leader) {
  const p = PLAYERS[pid];
  return `<div class="side ${p.cls}"><span class="who">${leader ? ICON.crown : ''}${esc(p.name)}${pid === S.me ? ' <span class="muted small">(you)</span>' : ''}</span>
    <span class="pts">${totalOf(pid).toLocaleString()}</span>
    <span class="sub num">${doneCount(pid)} chapters · ${currentStreak(pid)}-day streak</span></div>`;
}

function renderHome() {
  S.view = 'home';
  const me = S.me, other = PLAYERS[me].other, mine = chOf(me), theirs = chOf(other);
  const open = openCount(), tm = totalOf(me), to = totalOf(other);
  const lead = tm === to ? null : tm > to ? me : other;
  const hr = new Date().getHours(), greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const diff = Math.abs(tm - to);
  const leadText = !lead ? (tm === 0 ? 'Neck and neck. Let the games begin!' : 'Dead even!') : lead === me ? `You're ahead by ${diff.toLocaleString()}.` : `${PLAYERS[other].name} is ahead by ${diff.toLocaleString()}. Time to catch up!`;

  let todayHtml;
  if (!open) {
    todayHtml = `<div class="card today"><p class="label">Chapter 1 · ${esc(CHAPTERS[0].t)}</p><h3>Opens ${fmtDay(unlockAt(1))} at ${fmtTime(unlockAt(1))}</h3><p class="countdown" data-until="${unlockAt(1).getTime()}">${until(unlockAt(1))}</p></div>`;
  } else {
    const c = CHAPTERS[open - 1], r = mine[open], tr = theirs[open];
    const btn = !r ? `<button class="btn block" data-act="start" data-n="${open}">Begin chapter ${open}</button>`
      : !r.done ? `<button class="btn block" data-act="start" data-n="${open}">Continue chapter ${open}</button>`
      : `<div class="row"><span class="chip done">Finished · ${r.total} pts</span><button class="btn ghost" data-act="start" data-n="${open}">Replay for fun</button></div>`;
    const theirsTxt = tr && tr.done ? `${PLAYERS[other].name} has finished today's chapter.` : `${PLAYERS[other].name} hasn't played today's chapter yet.`;
    todayHtml = `<div class="card today">
      <div class="art">${Art.render(c.s[0][0], c.t)}</div>
      <div><p class="label">Today · Chapter ${open} of ${N} · ${esc(c.e)}</p><h3>${esc(c.t)}</h3><p class="muted">${esc(c.r)}</p></div>
      ${btn}
      <p class="small muted">${theirsTxt}${open < N ? ` Next chapter opens in <span data-until="${unlockAt(open + 1).getTime()}">${until(unlockAt(open + 1))}</span>.` : ''}</p>
    </div>`;
  }
  const missed = []; for (let n = 1; n < open; n++) if (!mine[n] || !mine[n].done) missed.push(n);
  const catchHtml = missed.length ? `<div class="card"><div><p class="label">Catch up</p><p class="small muted">Missed chapters still score points, but not the on-time or streak bonus.</p></div>
    <div class="row">${missed.slice(0, 12).map(n => `<button class="btn ghost" data-act="start" data-n="${n}">${n}. ${esc(CHAPTERS[n - 1].t)}</button>`).join('')}</div></div>` : '';

  const notes = S.notes.slice(0, 30);
  const notesHtml = `<div class="card"><div><p class="label">Notes between you</p></div>
    <div class="notes">${notes.length ? notes.map(n => `<div class="note ${n.from === me ? 'me' : ''}"><span class="meta">${esc(PLAYERS[n.from]?.name || 'Someone')}${n.ch ? ` · after ch. ${n.ch}` : ''} · ${new Date(n.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span><span class="txt">${esc(n.text)}</span></div>`).join('') : `<p class="muted small">No notes yet. Leave ${PLAYERS[other].name} some encouragement, a favorite verse, or a little friendly trash talk.</p>`}</div>
    <div class="compose"><textarea id="note-home" rows="1" maxlength="500" placeholder="Write to ${PLAYERS[other].name}…" aria-label="Write a note to ${PLAYERS[other].name}"></textarea><button class="btn" data-act="note-home">Send</button></div></div>`;

  const badgeHtml = `<div class="card"><p class="label">Badges</p><div class="badges">${BADGES.map(b => {
    const m = b.test(mine, me), o = b.test(theirs, other);
    return `<div class="badge ${m ? 'got' : ''}"><span class="seal">${ICON[b.icon]}</span>${esc(b.name)}<span class="by"><i class="dot ${m ? PLAYERS[me].cls : 'off'}" title="${PLAYERS[me].name}"></i><i class="dot ${o ? PLAYERS[other].cls : 'off'}" title="${PLAYERS[other].name}"></i></span></div>`;
  }).join('')}</div></div>`;

  let lastEra = '', listHtml = '';
  CHAPTERS.forEach((c, i) => {
    const n = i + 1, locked = n > open, m = mine[n]?.done, o = theirs[n]?.done;
    if (c.e !== lastEra) { listHtml += `<div class="era">${esc(c.e)}</div>`; lastEra = c.e; }
    listHtml += `<button class="ch ${locked ? 'locked' : ''} ${m && o ? 'both' : ''} ${n === open ? 'today' : ''}" data-act="${locked ? 'locked' : 'start'}" data-n="${n}">
      <span class="knot">${n}</span><span class="nm"><b>${esc(c.t)}</b><span>${locked ? `${ICON.lock} Opens ${fmtDay(unlockAt(n))}` : `${esc(c.r)}${mine[n]?.done ? ` · ${mine[n].total} pts` : ''}`}</span></span>
      <span class="who2"><i class="dot ${m ? PLAYERS[me].cls : 'off'}" title="${PLAYERS[me].name}"></i><i class="dot ${o ? PLAYERS[other].cls : 'off'}" title="${PLAYERS[other].name}"></i></span></button>`;
  });

  const draft = $('#note-home')?.value || '';
  app.innerHTML = `<div class="wrap">
    <div class="top"><div class="mark">${threadMark}<h1>The Scarlet Thread</h1></div><button class="icon-btn" data-act="theme" aria-label="Theme and settings">${ICON.palette}</button></div>
    <div class="greet"><h2>${greet}, ${esc(PLAYERS[me].name)}.</h2><p>${fmtDay(new Date())}</p></div>
    ${S.mode === 'local' ? '<p class="banner">Not connected to the shared scoreboard. Scores are only saving on this phone.</p>' : ''}
    ${!S.canWrite ? '<p class="banner">Your progress isn\'t saving to the scoreboard. Make sure you opened the game from the link Melisa sent.</p>' : ''}
    <div class="card"><div class="score">${scoreSide(me, lead === me)}<span class="vs">vs</span>${scoreSide(other, lead === other)}</div><p class="lead-note">${esc(leadText)}</p></div>
    ${todayHtml}
    ${catchHtml}
    ${notesHtml}
    ${badgeHtml}
    <div><p class="label">The thread · Genesis to Revelation</p><div class="thread">${listHtml}</div></div>
  </div>`;
  if (draft) $('#note-home').value = draft;
}

// ---- Play -------------------------------------------------------------------
function startChapter(n) {
  if (n > openCount()) return;
  const rec = clone(chOf(S.me)[n]);
  const replay = !!rec.done;
  S.play = { n, replay, rec: replay ? {} : rec, step: replay ? 0 : Math.min(rec.step || 0, STEPS.length - 1), t0: 0, picked: [], sel: null };
  S.view = 'play'; renderPlay(); window.scrollTo(0, 0);
}
function persist(patch) {
  const P = S.play; if (P.replay) { merge(P.rec, patch); return; }
  merge(P.rec, patch);
  savePlayer(S.me, { chapters: { [P.n]: patch } });
}
function next() { const P = S.play; P.step = Math.min(P.step + 1, STEPS.length - 1); P.sel = null; P.picked = []; P.t0 = 0; if (!P.replay && (P.rec.step || 0) < P.step) persist({ step: P.step }); renderPlay(); window.scrollTo(0, 0); }

function renderPlay() {
  const P = S.play, c = CHAPTERS[P.n - 1], st = STEPS[P.step];
  let body = '', foot = '';
  const steps = STEPS.map((_, i) => `<i class="${i <= P.step ? 'on' : ''}"></i>`).join('');
  if (st[0] === 's') {
    const i = +st[1], [spec, text] = c.s[i];
    body = `<div class="art">${Art.render(spec, text)}</div><p class="story">${esc(text)}</p>`;
    foot = `${i > 0 ? '<button class="btn ghost" data-act="back">Back</button>' : ''}<button class="btn" data-act="next">${i < 2 ? 'Next' : 'Continue'}</button>`;
  } else if (st === 'cho') {
    const [q, opts, refl] = c.c, chosen = P.rec.cho ?? P.sel;
    body = `<p class="label">A moment to reflect</p><p class="q">${esc(q)}</p><div class="opts">${opts.map((o, i) => `<button class="opt ${chosen === i ? 'sel' : ''}" data-act="cho" data-i="${i}" ${chosen != null ? 'disabled' : ''}><span class="k">${String.fromCharCode(65 + i)}</span>${esc(o)}</button>`).join('')}</div>
      ${chosen != null ? `<div class="feedback"><b>There's no wrong answer here.</b><span>${esc(refl)}</span><span class="pts-pop">+50 for reflecting</span></div>` : ''}`;
    foot = `<button class="btn" data-act="next" ${chosen == null ? 'disabled' : ''}>Continue</button>`;
  } else if (st[0] === 'q') {
    const qi = +st[1], [q, ...ans] = c.q[qi], order = shuffled(ans, P.n * 31 + qi), done = P.rec.q && P.rec.q[qi];
    if (!done && !P.t0) P.t0 = performance.now();
    body = `<p class="label">Question ${qi + 1} of 3${P.replay ? ' · replay, just for fun' : ''}</p><p class="q">${esc(q)}</p>
      ${!done ? '<div class="timer"><i id="tbar"></i></div>' : ''}
      <div class="opts">${order.map(([a, orig], k) => {
        const cls = done ? (orig === 0 ? 'right' : (done.a === orig ? 'wrong' : '')) : '';
        return `<button class="opt ${cls}" data-act="ans" data-o="${orig}" ${done ? 'disabled' : ''}><span class="k">${String.fromCharCode(65 + k)}</span>${esc(a)}</button>`;
      }).join('')}</div>
      ${done ? `<div class="feedback"><b>${done.ok ? 'Correct!' : 'Not quite.'}</b>${done.ok ? '' : `<span>The answer is: ${esc(ans[0])}</span>`}<span class="pts-pop">+${done.pts}${done.ok && done.pts > 100 ? ` (speed bonus +${done.pts - 100})` : ''}</span></div>` : '<p class="small muted">Answer fast for a speed bonus. Your first answer counts.</p>'}`;
    foot = `<button class="btn" data-act="next" ${done ? '' : 'disabled'}>Continue</button>`;
  } else if (st === 'chal') {
    body = P.n % 2 ? orderChallenge(P, c) : verseChallenge(P, c);
    foot = `<button class="btn" data-act="${P.rec.ch ? 'next' : 'check'}" ${P.rec.ch || canCheck(P, c) ? '' : 'disabled'}>${P.rec.ch ? 'See the thread' : 'Check'}</button>`;
  } else {
    body = endScreen(P, c);
    foot = `<button class="btn" data-act="home">Back to the thread</button>`;
  }
  app.innerHTML = `<div class="wrap play">
    <div class="bar"><button class="icon-btn" data-act="home" aria-label="Close chapter">${ICON.close}</button><div class="ttl"><span class="label">Chapter ${P.n} · ${esc(c.r)}</span><b>${esc(c.t)}</b></div></div>
    <div class="steps" aria-hidden="true">${steps}</div>
    <div class="stage">${body}</div>
    <div class="foot">${foot}</div></div>`;
  if ($('#tbar')) { const bar = $('#tbar'); bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = 'transform 20s linear'; bar.style.transform = 'scaleX(0)'; })); }
}

function orderChallenge(P, c) {
  const items = shuffled(c.o, P.n * 17 + 3);
  if (items.every(([, i], k) => i === k)) items.push(items.shift());
  const done = P.rec.ch;
  if (!done && !P.t0) P.t0 = performance.now();
  return `<p class="label">Challenge · Put it in order</p><p class="q">Tap the events in the order they happened.</p>
    <div class="opts order">${items.map(([t, orig]) => {
      const pos = P.picked.indexOf(orig);
      const cls = done ? (done.order[orig] === orig ? 'right' : 'wrong') : pos >= 0 ? 'picked' : '';
      const k = done ? done.order[orig] + 1 : pos >= 0 ? pos + 1 : '';
      return `<button class="opt ${cls} ${pos >= 0 ? 'picked' : ''}" data-act="pick-o" data-o="${orig}" ${done ? 'disabled' : ''}><span class="k">${k}</span>${esc(t)}</button>`;
    }).join('')}</div>
    ${done ? `<div class="feedback"><b>${done.ok ? 'Perfect order!' : `${done.right} of 4 in the right spot.`}</b>${done.ok ? '' : `<span>The order: ${c.o.map((t, i) => `${i + 1}. ${esc(t)}`).join(' · ')}</span>`}<span class="pts-pop">+${done.pts}</span></div>` : '<p class="small muted">Tap a picked event again to undo it. 50 points for each one in the right spot.</p>'}`;
}
function verseChallenge(P, c) {
  const [text, ref, tr, key, decoys] = c.v, done = P.rec.ch;
  if (!done && !P.t0) P.t0 = performance.now();
  const m = new RegExp(`(^|[^A-Za-z])${key.replace(/[-]/g, '\\-')}(?![A-Za-z])`).exec(text);
  const at = m ? m.index + m[1].length : text.indexOf(key);
  const html = esc(text.slice(0, at)) + (done ? `<span class="blank">${esc(key)}</span>` : '<span class="blank">&nbsp;?&nbsp;</span>') + esc(text.slice(at + key.length));
  const words = shuffled([key, ...decoys], P.n * 13 + 7);
  return `<p class="label">Challenge · Fill in the verse</p><div class="verse">${html}<cite>${esc(ref)} (${esc(tr)})</cite></div>
    <div class="words">${words.map(([w, orig]) => {
      const cls = done ? (orig === 0 ? 'right' : done.a === orig ? 'wrong' : '') : P.sel === orig ? 'sel' : '';
      return `<button class="opt ${cls}" data-act="pick-w" data-o="${orig}" ${done ? 'disabled' : ''}>${esc(w)}</button>`;
    }).join('')}</div>
    ${done ? `<div class="feedback"><b>${done.ok ? 'Exactly right!' : 'Not quite, but now you know it.'}</b><span class="pts-pop">+${done.pts}</span></div>` : '<p class="small muted">Pick the missing word, then tap Check. 200 points if it\'s right, plus a speed bonus.</p>'}`;
}
function canCheck(P, c) { return P.n % 2 ? P.picked.length === c.o.length : P.sel != null; }
function check() {
  const P = S.play, c = CHAPTERS[P.n - 1], ms = performance.now() - (P.t0 || performance.now());
  let ch;
  if (P.n % 2) {
    const order = {}; P.picked.forEach((orig, pos) => order[orig] = pos);
    const right = c.o.filter((_, i) => order[i] === i).length;
    ch = { order, right, ok: right === c.o.length, pts: right * 50, ms: Math.round(ms) };
  } else {
    const ok = P.sel === 0; ch = { a: P.sel, ok, pts: ok ? 200 + (ms < 6000 ? 50 : ms < 12000 ? 25 : 0) : 0, ms: Math.round(ms) };
  }
  persist({ ch }); renderPlay();
}
function finish(P) {
  const r = P.rec, quiz = [0, 1, 2].reduce((s, i) => s + (r.q?.[i]?.pts || 0), 0), chal = r.ch?.pts || 0, refl = r.cho != null ? 50 : 0;
  const onTime = new Date() < unlockAt(P.n + 1);
  const c = clone(chOf(S.me)); c[P.n] = { ...(c[P.n] || {}), onTime };
  const streak = onTime ? streakEnding(c, P.n) : 0;
  const ontimePts = onTime ? 100 : 0, streakPts = onTime ? Math.min(streak, 7) * 15 : 0;
  const total = quiz + chal + refl + ontimePts + streakPts;
  persist({ done: true, total, onTime, streak, at: Date.now(), step: STEPS.length - 1, parts: { quiz, chal, refl, ontimePts, streakPts } });
}
function endScreen(P, c) {
  if (!P.replay && !P.rec.done) finish(P);
  const r = P.rec, pr = r.parts || {}, other = PLAYERS[S.me].other;
  const [text, ref, tr] = c.v;
  const tally = P.replay ? '<p class="muted small">Replays are just for fun, so your original score stays.</p>' : `<div class="tally">
      <span>Quiz</span><span>${pr.quiz ?? 0}</span><span>Challenge</span><span>${pr.chal ?? 0}</span><span>Reflection</span><span>${pr.refl ?? 0}</span>
      <span>On-time bonus</span><span>${pr.ontimePts ?? 0}</span><span>Streak bonus${r.streak ? ` (${r.streak} day${r.streak > 1 ? 's' : ''})` : ''}</span><span>${pr.streakPts ?? 0}</span>
      <span class="tot">Chapter total</span><span class="tot">${r.total ?? 0}</span></div>`;
  return `<div class="thread-moment">
    <svg class="tm-line" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true"><path d="M4 20 C60 0, 90 40, 150 20 S240 0, 280 20 S360 40, 396 20"/></svg>
    <p class="label">The scarlet thread</p>
    <p class="story">${esc(c.th)}</p>
    <div class="verse">${esc(text)}<cite>${esc(ref)} (${esc(tr)})</cite></div>
    <div class="card"><p class="label">Chapter ${P.n} complete</p>${tally}</div>
    <div class="card"><p class="label">Leave ${PLAYERS[other].name} a note</p>
      <div class="compose"><textarea id="note-end" rows="2" maxlength="500" placeholder="What stood out to you today?" aria-label="Note to ${PLAYERS[other].name}"></textarea><button class="btn" data-act="note-end">Send</button></div></div>
    ${P.n < N ? `<p class="small muted center">Chapter ${P.n + 1}, ${esc(CHAPTERS[P.n].t)}, opens ${fmtDay(unlockAt(P.n + 1))} at ${fmtTime(unlockAt(P.n + 1))}.</p>` : '<p class="story">You\'ve walked the whole thread, Genesis to Revelation. "Come, Lord Jesus."</p>'}
  </div>`;
}

// ---- Sheet: theme + settings ------------------------------------------------
function openSheet() {
  const cur = document.documentElement.getAttribute('data-palette');
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Theme and settings">
    <div class="top"><h2 style="flex:1">Theme colors</h2><button class="icon-btn" data-act="close-sheet" aria-label="Close">${ICON.close}</button></div>
    <div class="swatches">${PALETTES.map(p => `<button class="sw ${cur === p.id ? 'on' : ''}" data-act="pal" data-id="${p.id}" style="background:${p.c[0]};color:${p.id === 'night' ? '#ecebf5' : '#2a2018'}"><span class="pal">${p.c.map(x => `<i style="background:${x}"></i>`).join('')}</span>${p.name}</button>`).join('')}</div>
    <button class="btn ghost" data-act="pal" data-id="">Match my phone (light or dark)</button>
    ${S.me ? `<div class="card"><p>Playing as <b>${esc(PLAYERS[S.me].name)}</b>.</p><button class="btn ghost" data-act="switch">Switch player</button></div>` : ''}
    <div class="card"><p class="label">How scoring works</p><p class="small">Quiz: 100 per right answer, plus up to 50 for speed. Challenge: up to 200. Reflection: 50. Finish a chapter before the next one opens for +100, plus a streak bonus of 15 per day in a row (up to 105). Only your first try counts.</p></div>
    <p class="credits">Scripture quotations marked NIV are taken from the Holy Bible, New International Version®, NIV®. Copyright © 1973, 1978, 1984, 2011 by Biblica, Inc.™ Used by permission. All rights reserved worldwide.<br><br>Scripture quotations marked ESV are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.<br><br>Made with love for Melisa &amp; Noreen.</p>
  </div>`;
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}

// ---- Events -----------------------------------------------------------------
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, P = S.play;
  switch (act) {
    case 'theme': openSheet(); break;
    case 'close-sheet': b.closest('.sheet-bg').remove(); break;
    case 'pal': {
      const id = b.dataset.id || null; applyPalette(id); if (id) ls.set('st-palette', id); else ls.del('st-palette');
      document.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s.dataset.id === id));
      if (S.me && S.canWrite && S.players[S.me]) savePlayer(S.me, { theme: id });
      break;
    }
    case 'switch': ls.del('st-me'); S.me = null; S.view = 'who'; b.closest('.sheet-bg')?.remove(); render(); break;
    case 'pick': {
      const id = b.dataset.id; b.disabled = true;
      await ready;
      if (S.mode === 'live') {
        let cur = null; try { const snap = await S.db.collection('players').doc(id).get(); cur = snap.exists ? snap.data() : null; } catch {}
        if (!cur) await savePlayer(id, { theme: ls.get('st-palette', null), chapters: {}, joined: Date.now() }, true);
        else S.players[id] = cur;
      } else if (!S.players[id]) await savePlayer(id, { theme: ls.get('st-palette', null), chapters: {}, joined: Date.now() });
      S.me = id; ls.set('st-me', id); S.themeSynced = false; syncTheme(); S.view = 'home'; render(); window.scrollTo(0, 0);
      break;
    }
    case 'start': startChapter(+b.dataset.n); break;
    case 'locked': { const n = +b.dataset.n; toast(`Chapter ${n} opens ${fmtDay(unlockAt(n))} at ${fmtTime(unlockAt(n))}.`); break; }
    case 'home': S.view = 'home'; S.play = null; render(); window.scrollTo(0, 0); break;
    case 'next': next(); break;
    case 'back': P.step = Math.max(0, P.step - 1); renderPlay(); break;
    case 'cho': if (P.rec.cho == null) { persist({ cho: +b.dataset.i }); renderPlay(); } break;
    case 'ans': {
      const qi = +STEPS[P.step][1]; if (P.rec.q && P.rec.q[qi]) break;
      const a = +b.dataset.o, ok = a === 0, ms = Math.round(performance.now() - (P.t0 || performance.now()));
      persist({ q: { [qi]: { a, ok, ms, pts: ok ? 100 + speedBonus(ms) : 0 } } }); renderPlay(); break;
    }
    case 'pick-o': {
      const o = +b.dataset.o, i = P.picked.indexOf(o);
      if (i === -1) P.picked.push(o); else P.picked.splice(i);
      renderPlay(); break;
    }
    case 'pick-w': P.sel = +b.dataset.o; renderPlay(); break;
    case 'check': if (canCheck(P, CHAPTERS[P.n - 1]) && !P.rec.ch) check(); break;
    case 'note-home': case 'note-end': {
      const ta = $(act === 'note-home' ? '#note-home' : '#note-end'), t = ta.value.trim(); if (!t) return;
      b.disabled = true; const ok = await addNote(t, act === 'note-end' ? P?.n : null); b.disabled = false;
      if (ok) { ta.value = ''; toast(`Sent to ${PLAYERS[PLAYERS[S.me].other].name}.`); }
      break;
    }
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelector('.sheet-bg')?.remove(); });

// Live countdowns; re-render the home screen when a new chapter opens.
let lastOpen = openCount();
setInterval(() => {
  document.querySelectorAll('[data-until]').forEach(el => el.textContent = until(new Date(+el.dataset.until)));
  const o = openCount(); if (o !== lastOpen) { lastOpen = o; renderIfHome(); }
}, 20000);

// ---- Boot -------------------------------------------------------------------
render();
connect();
})();
</script>
</body></html>
